<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 868" lang="hi" role="img" aria-labelledby="visual-hi-868-title visual-hi-868-desc">
<title id="visual-hi-868-title">भूमिका हस्तांतरण: एक इवेंट, दो अलग परिणाम</title><desc id="visual-hi-868-desc">पुराना डिवाइस चालू रहता है। एक इवेंट नया बंद करता है। ठीक एक अपेक्षित कॉल; पुराने को बंद करना निषिद्ध है। तार्किक चरण बीता समय नहीं मापते।</desc><rect width="1200" height="868" fill="#f5f8fc"/><g font-family="Arial, DejaVu Sans, sans-serif"><rect x="0" y="0" width="1200" height="152" rx="0" fill="#15283f" stroke="none"/><rect x="40" y="30" width="6" height="92" rx="3" fill="#43d0bd" stroke="none"/><text x="62" y="49" font-size="15" fill="#91e4da" font-weight="650" text-anchor="start">HA HOMELAB / 04</text><text x="62" y="91" font-size="32" fill="white" font-weight="700" text-anchor="start">भूमिका हस्तांतरण: एक इवेंट, दो अलग परिणाम</text><text x="62" y="125" font-size="17" fill="#d4e1ef" font-weight="400" text-anchor="start">शामिल कृत्रिम परिदृश्य · असली HA इंजन · मेमोरी में डिवाइस कॉलबैक</text><text x="340" y="207" font-size="15" fill="#486078" font-weight="700" text-anchor="middle">शुरुआत</text><text x="700" y="207" font-size="15" fill="#486078" font-weight="700" text-anchor="middle">इवेंट / क्रिया</text><text x="1080" y="207" font-size="15" fill="#486078" font-weight="700" text-anchor="middle">अंत</text><rect x="40" y="236" width="1120" height="147" rx="16" fill="white" stroke="#cbd8e5"/><path d="M316 282 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="288" font-size="17" fill="#486078" font-weight="400" text-anchor="start">ON</text><path d="M316 343 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="349" font-size="17" fill="#486078" font-weight="400" text-anchor="start">OFF</text><rect x="40" y="409" width="1120" height="147" rx="16" fill="white" stroke="#cbd8e5"/><path d="M316 455 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="461" font-size="17" fill="#486078" font-weight="400" text-anchor="start">ON</text><path d="M316 516 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="522" font-size="17" fill="#486078" font-weight="400" text-anchor="start">OFF</text><path d="M700 224 V583" fill="none" stroke="#486078" stroke-width="2" stroke-dasharray="5 6"/><text x="62" y="284" font-size="22" fill="#116f93" font-weight="700" text-anchor="start">पुराना हार्डवेयर</text><text x="62" y="347" font-size="17" fill="#486078" font-weight="400" text-anchor="start">कोई कमांड नहीं भेजा</text><text x="62" y="457" font-size="22" fill="#7052b5" font-weight="700" text-anchor="start">नई भूमिका</text><text x="62" y="520" font-size="17" fill="#486078" font-weight="400" text-anchor="start">एक turn_off कॉल</text><path d="M340 282 H1080" fill="none" stroke="#116f93" stroke-width="6"/><path d="M340 455 H700 V516 H1080" fill="none" stroke="#7052b5" stroke-width="6"/><circle cx="340" cy="282" r="8" fill="#116f93"/><circle cx="1080" cy="282" r="8" fill="#116f93"/><circle cx="340" cy="455" r="8" fill="#7052b5"/><circle cx="1080" cy="516" r="8" fill="#7052b5"/><text x="600" y="612" font-size="19" fill="#15283f" font-weight="600" text-anchor="middle">तार्किक क्रम (मापा समय-अक्ष नहीं)</text><rect x="40" y="647" width="548" height="110" rx="16" fill="#eee8fa" stroke="none"/><text x="60" y="679" font-size="14" fill="#7052b5" font-weight="700" text-anchor="start">अपेक्षित कॉल</text><text x="60" y="711" font-size="19" fill="#7052b5" font-weight="600" text-anchor="start">switch.turn_off → switch.scenario_table</text><text x="60" y="739" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">अंतिम स्थिति: बंद</text><rect x="612" y="647" width="548" height="110" rx="16" fill="#e2f3fb" stroke="none"/><text x="632" y="679" font-size="14" fill="#116f93" font-weight="700" text-anchor="start">निषिद्ध कॉल</text><text x="632" y="711" font-size="19" fill="#116f93" font-weight="600" text-anchor="start">turn_off → switch.scenario_retired_plug</text><text x="632" y="739" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">अंतिम स्थिति: चालू</text><text x="40" y="802" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">फ़िक्स्चर इवेंट से पहले 40 ms और स्थिर होने के लिए 100 ms माँगता है; ये मापी देरी नहीं हैं।</text><text x="40" y="838" font-size="16" fill="#486078" font-weight="400" text-anchor="start">स्रोत: role-transfer.scenario.json · यह चार्ट भौतिक रिले या बिजली आपूर्ति नहीं जाँचता।</text></g></svg>

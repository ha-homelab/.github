<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 874" lang="ru" role="img" aria-labelledby="visual-ru-874-title visual-ru-874-desc">
<title id="visual-ru-874-title">От изменения к проверенному результату</title><desc id="visual-ru-874-desc">Выберите независимые проверки, оцените их результаты, затем проведите отдельную физическую приёмку. Стрелки — передача на ревью, а не готовый конвейер.</desc><rect width="1200" height="874" fill="#f5f8fc"/><g font-family="Arial, DejaVu Sans, sans-serif"><rect x="0" y="0" width="1200" height="152" rx="0" fill="#15283f" stroke="none"/><rect x="40" y="30" width="6" height="92" rx="3" fill="#43d0bd" stroke="none"/><text x="62" y="49" font-size="15" fill="#91e4da" font-weight="650" text-anchor="start">HA HOMELAB / 01</text><text x="62" y="91" font-size="32" fill="white" font-weight="700" text-anchor="start">От изменения к проверенному результату</text><text x="62" y="125" font-size="17" fill="#d4e1ef" font-weight="400" text-anchor="start">Четыре инструмента. Явные входные данные. Ревью до внедрения.</text><rect x="40" y="180" width="1120" height="59" rx="16" fill="#e6edf5" stroke="none"/><text x="600" y="217" font-size="21" fill="#15283f" font-weight="600" text-anchor="middle">01  Подготовьте локальные данные и выберите проверки для изменения</text><path d="M171 239 L171 270" fill="none" stroke="#486078" stroke-width="2"/><path d="M166 262 L171 270 L176 262" fill="none" stroke="#486078" stroke-width="2"/><rect x="40" y="279" width="262" height="284" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="279" width="262" height="8" rx="4" fill="#116f93" stroke="none"/><text x="58" y="323" font-size="21" fill="#116f93" font-weight="700" text-anchor="start">Entity Migrations</text><text x="58" y="359" font-size="19" fill="#15283f" font-weight="600" text-anchor="start">Что переносим?</text><text x="58" y="396" font-size="18" fill="#486078" font-weight="400" text-anchor="start">Манифест, снимок и</text><text x="58" y="421" font-size="18" fill="#486078" font-weight="400" text-anchor="start">поддерживаемые файлы</text><rect x="54" y="497" width="234" height="48" rx="8" fill="#e2f3fb" stroke="none"/><text x="171" y="527" font-size="17" fill="#116f93" font-weight="650" text-anchor="middle">План + конфликты</text><path d="M171 563 L171 597" fill="none" stroke="#486078" stroke-width="2"/><path d="M166 589 L171 597 L176 589" fill="none" stroke="#486078" stroke-width="2"/><path d="M457 239 L457 270" fill="none" stroke="#486078" stroke-width="2"/><path d="M452 262 L457 270 L462 262" fill="none" stroke="#486078" stroke-width="2"/><rect x="326" y="279" width="262" height="284" rx="16" fill="white" stroke="#cbd8e5"/><rect x="326" y="279" width="262" height="8" rx="4" fill="#087967" stroke="none"/><text x="344" y="323" font-size="21" fill="#087967" font-weight="700" text-anchor="start">Meter Contracts</text><text x="344" y="359" font-size="19" fill="#15283f" font-weight="600" text-anchor="start">Что измеряем?</text><text x="344" y="396" font-size="18" fill="#486078" font-weight="400" text-anchor="start">Топология измерителей,</text><text x="344" y="421" font-size="18" fill="#486078" font-weight="400" text-anchor="start">время, единицы, источник</text><rect x="340" y="497" width="234" height="48" rx="8" fill="#e0f4ec" stroke="none"/><text x="457" y="527" font-size="17" fill="#087967" font-weight="650" text-anchor="middle">Замечания + суммы</text><path d="M457 563 L457 597" fill="none" stroke="#486078" stroke-width="2"/><path d="M452 589 L457 597 L462 589" fill="none" stroke="#486078" stroke-width="2"/><path d="M743 239 L743 270" fill="none" stroke="#486078" stroke-width="2"/><path d="M738 262 L743 270 L748 262" fill="none" stroke="#486078" stroke-width="2"/><rect x="612" y="279" width="262" height="284" rx="16" fill="white" stroke="#cbd8e5"/><rect x="612" y="279" width="262" height="8" rx="4" fill="#7052b5" stroke="none"/><text x="630" y="323" font-size="21" fill="#7052b5" font-weight="700" text-anchor="start">Scenario Tests</text><text x="630" y="359" font-size="19" fill="#15283f" font-weight="600" text-anchor="start">Что выполнит HA?</text><text x="630" y="396" font-size="18" fill="#486078" font-weight="400" text-anchor="start">Учебная</text><text x="630" y="421" font-size="18" fill="#486078" font-weight="400" text-anchor="start">последовательность,</text><text x="630" y="446" font-size="18" fill="#486078" font-weight="400" text-anchor="start">состояния и ожидания</text><rect x="626" y="497" width="234" height="48" rx="8" fill="#eee8fa" stroke="none"/><text x="743" y="527" font-size="17" fill="#7052b5" font-weight="650" text-anchor="middle">Вызовы + состояния</text><path d="M743 563 L743 597" fill="none" stroke="#486078" stroke-width="2"/><path d="M738 589 L743 597 L748 589" fill="none" stroke="#486078" stroke-width="2"/><path d="M1029 239 L1029 270" fill="none" stroke="#486078" stroke-width="2"/><path d="M1024 262 L1029 270 L1034 262" fill="none" stroke="#486078" stroke-width="2"/><rect x="898" y="279" width="262" height="284" rx="16" fill="white" stroke="#cbd8e5"/><rect x="898" y="279" width="262" height="8" rx="4" fill="#b54537" stroke="none"/><text x="916" y="323" font-size="21" fill="#b54537" font-weight="700" text-anchor="start">Assist Scenario Lab</text><text x="916" y="359" font-size="19" fill="#15283f" font-weight="600" text-anchor="start">Что наблюдали?</text><text x="916" y="396" font-size="18" fill="#486078" font-weight="400" text-anchor="start">Локальные записи</text><text x="916" y="421" font-size="18" fill="#486078" font-weight="400" text-anchor="start">команды, действия и</text><text x="916" y="446" font-size="18" fill="#486078" font-weight="400" text-anchor="start">звука</text><rect x="912" y="497" width="234" height="48" rx="8" fill="#fcece5" stroke="none"/><text x="1029" y="527" font-size="17" fill="#b54537" font-weight="650" text-anchor="middle">Итог + пробелы данных</text><path d="M1029 563 L1029 597" fill="none" stroke="#486078" stroke-width="2"/><path d="M1024 589 L1029 597 L1034 589" fill="none" stroke="#486078" stroke-width="2"/><rect x="40" y="606" width="1120" height="85" rx="16" fill="#15283f" stroke="none"/><text x="62" y="641" font-size="24" fill="white" font-weight="650" text-anchor="start">02  Проверьте область, конфликты и недостающие данные</text><text x="62" y="674" font-size="18" fill="#d4e1ef" font-weight="400" text-anchor="start">Сохраните отчёты с изменением; исправьте входные данные и повторите нужные проверки.</text><path d="M40 723 H1160" fill="none" stroke="#b54537" stroke-width="2" stroke-dasharray="8 7"/><text x="40" y="763" font-size="25" fill="#b54537" font-weight="650" text-anchor="start">03  Внедрите через ревью и проверьте физическое устройство</text><text x="40" y="797" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">Радиосвязь · контакты реле · реальная нагрузка · время измерения · слышимый звук</text><text x="40" y="843" font-size="16" fill="#486078" font-weight="400" text-anchor="start">Стрелки = передача на ревью. Инструменты не образуют автоматический конвейер внедрения.</text></g></svg>

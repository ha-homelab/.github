<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 874" lang="ko" role="img" aria-labelledby="visual-ko-874-title visual-ko-874-desc">
<title id="visual-ko-874-title">제안된 변경에서 검토된 근거로</title><desc id="visual-ko-874-desc">관련 독립 검사를 선택하고 출력을 검토한 뒤 별도 실물 인수 검증을 수행합니다. 화살표는 사람 간 인계이며 배포된 파이프라인이 아닙니다.</desc><rect width="1200" height="874" fill="#f5f8fc"/><g font-family="Arial, DejaVu Sans, sans-serif"><rect x="0" y="0" width="1200" height="152" rx="0" fill="#15283f" stroke="none"/><rect x="40" y="30" width="6" height="92" rx="3" fill="#43d0bd" stroke="none"/><text x="62" y="49" font-size="15" fill="#91e4da" font-weight="650" text-anchor="start">HA HOMELAB / 01</text><text x="62" y="91" font-size="32" fill="white" font-weight="700" text-anchor="start">제안된 변경에서 검토된 근거로</text><text x="62" y="125" font-size="17" fill="#d4e1ef" font-weight="400" text-anchor="start">네 도구. 명시적인 입력. 배포 전 검토.</text><rect x="40" y="180" width="1120" height="59" rx="16" fill="#e6edf5" stroke="none"/><text x="600" y="217" font-size="21" fill="#15283f" font-weight="600" text-anchor="middle">01  로컬 입력을 준비하고 변경에 맞는 검사 선택</text><path d="M171 239 L171 270" fill="none" stroke="#486078" stroke-width="2"/><path d="M166 262 L171 270 L176 262" fill="none" stroke="#486078" stroke-width="2"/><rect x="40" y="279" width="262" height="284" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="279" width="262" height="8" rx="4" fill="#116f93" stroke="none"/><text x="58" y="323" font-size="21" fill="#116f93" font-weight="700" text-anchor="start">Entity Migrations</text><text x="58" y="359" font-size="19" fill="#15283f" font-weight="600" text-anchor="start">무엇을 옮기나?</text><text x="58" y="396" font-size="18" fill="#486078" font-weight="400" text-anchor="start">매니페스트, 스냅샷, 지원</text><text x="58" y="421" font-size="18" fill="#486078" font-weight="400" text-anchor="start">소스 파일</text><rect x="54" y="497" width="234" height="48" rx="8" fill="#e2f3fb" stroke="none"/><text x="171" y="527" font-size="17" fill="#116f93" font-weight="650" text-anchor="middle">계획 + 충돌</text><path d="M171 563 L171 597" fill="none" stroke="#486078" stroke-width="2"/><path d="M166 589 L171 597 L176 589" fill="none" stroke="#486078" stroke-width="2"/><path d="M457 239 L457 270" fill="none" stroke="#486078" stroke-width="2"/><path d="M452 262 L457 270 L462 262" fill="none" stroke="#486078" stroke-width="2"/><rect x="326" y="279" width="262" height="284" rx="16" fill="white" stroke="#cbd8e5"/><rect x="326" y="279" width="262" height="8" rx="4" fill="#087967" stroke="none"/><text x="344" y="323" font-size="21" fill="#087967" font-weight="700" text-anchor="start">Meter Contracts</text><text x="344" y="359" font-size="19" fill="#15283f" font-weight="600" text-anchor="start">무엇을 측정하나?</text><text x="344" y="396" font-size="18" fill="#486078" font-weight="400" text-anchor="start">계측 구조, 시각, 단위,</text><text x="344" y="421" font-size="18" fill="#486078" font-weight="400" text-anchor="start">소스 식별자</text><rect x="340" y="497" width="234" height="48" rx="8" fill="#e0f4ec" stroke="none"/><text x="457" y="527" font-size="17" fill="#087967" font-weight="650" text-anchor="middle">확인 사항 + 유효 합계</text><path d="M457 563 L457 597" fill="none" stroke="#486078" stroke-width="2"/><path d="M452 589 L457 597 L462 589" fill="none" stroke="#486078" stroke-width="2"/><path d="M743 239 L743 270" fill="none" stroke="#486078" stroke-width="2"/><path d="M738 262 L743 270 L748 262" fill="none" stroke="#486078" stroke-width="2"/><rect x="612" y="279" width="262" height="284" rx="16" fill="white" stroke="#cbd8e5"/><rect x="612" y="279" width="262" height="8" rx="4" fill="#7052b5" stroke="none"/><text x="630" y="323" font-size="21" fill="#7052b5" font-weight="700" text-anchor="start">Scenario Tests</text><text x="630" y="359" font-size="19" fill="#15283f" font-weight="600" text-anchor="start">HA는 무엇을 하나?</text><text x="630" y="396" font-size="18" fill="#486078" font-weight="400" text-anchor="start">합성 순서, 초기 상태,</text><text x="630" y="421" font-size="18" fill="#486078" font-weight="400" text-anchor="start">단언</text><rect x="626" y="497" width="234" height="48" rx="8" fill="#eee8fa" stroke="none"/><text x="743" y="527" font-size="17" fill="#7052b5" font-weight="650" text-anchor="middle">호출 + 최종 상태</text><path d="M743 563 L743 597" fill="none" stroke="#486078" stroke-width="2"/><path d="M738 589 L743 597 L748 589" fill="none" stroke="#486078" stroke-width="2"/><path d="M1029 239 L1029 270" fill="none" stroke="#486078" stroke-width="2"/><path d="M1024 262 L1029 270 L1034 262" fill="none" stroke="#486078" stroke-width="2"/><rect x="898" y="279" width="262" height="284" rx="16" fill="white" stroke="#cbd8e5"/><rect x="898" y="279" width="262" height="8" rx="4" fill="#b54537" stroke="none"/><text x="916" y="323" font-size="21" fill="#b54537" font-weight="700" text-anchor="start">Assist Scenario Lab</text><text x="916" y="359" font-size="19" fill="#15283f" font-weight="600" text-anchor="start">무엇을 관측했나?</text><text x="916" y="396" font-size="18" fill="#486078" font-weight="400" text-anchor="start">의도·동작·들을 수 있는</text><text x="916" y="421" font-size="18" fill="#486078" font-weight="400" text-anchor="start">응답의 로컬 기록</text><rect x="912" y="497" width="234" height="48" rx="8" fill="#fcece5" stroke="none"/><text x="1029" y="527" font-size="17" fill="#b54537" font-weight="650" text-anchor="middle">결과 + 근거 부족</text><path d="M1029 563 L1029 597" fill="none" stroke="#486078" stroke-width="2"/><path d="M1024 589 L1029 597 L1034 589" fill="none" stroke="#486078" stroke-width="2"/><rect x="40" y="606" width="1120" height="85" rx="16" fill="#15283f" stroke="none"/><text x="62" y="641" font-size="24" fill="white" font-weight="650" text-anchor="start">02  범위, 충돌, 누락된 근거 검토</text><text x="62" y="674" font-size="18" fill="#d4e1ef" font-weight="400" text-anchor="start">보고서를 변경에 첨부하고 잘못된 입력을 수정한 뒤 관련 검사를 다시 실행합니다.</text><path d="M40 723 H1160" fill="none" stroke="#b54537" stroke-width="2" stroke-dasharray="8 7"/><text x="40" y="763" font-size="25" fill="#b54537" font-weight="650" text-anchor="start">03  검토 후 배포하고 실제 기기 확인</text><text x="40" y="797" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">무선 전달 · 릴레이 접점 · 실제 부하 · 소스 시각 · 들리는 소리</text><text x="40" y="843" font-size="16" fill="#486078" font-weight="400" text-anchor="start">화살표는 사람의 검토 인계입니다. 이 도구들은 자동 배포를 구현하지 않습니다.</text></g></svg>

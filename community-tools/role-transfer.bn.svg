<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 868" lang="bn" role="img" aria-labelledby="visual-bn-868-title visual-bn-868-desc">
<title id="visual-bn-868-title">ভূমিকা স্থানান্তর: এক ঘটনা, দুই ফল</title><desc id="visual-bn-868-desc">পুরোনো ডিভাইস চালু থাকে। একটি ঘটনা প্রতিস্থাপক বন্ধ করে। ঠিক একটি প্রত্যাশিত কল, পুরোনোটি বন্ধের কল নিষিদ্ধ। যৌক্তিক ধাপ মাপা সময় নয়।</desc><rect width="1200" height="868" fill="#f5f8fc"/><g font-family="Arial, DejaVu Sans, sans-serif"><rect x="0" y="0" width="1200" height="152" rx="0" fill="#15283f" stroke="none"/><rect x="40" y="30" width="6" height="92" rx="3" fill="#43d0bd" stroke="none"/><text x="62" y="49" font-size="15" fill="#91e4da" font-weight="650" text-anchor="start">HA HOMELAB / 04</text><text x="62" y="91" font-size="32" fill="white" font-weight="700" text-anchor="start">ভূমিকা স্থানান্তর: এক ঘটনা, দুই ফল</text><text x="62" y="125" font-size="17" fill="#d4e1ef" font-weight="400" text-anchor="start">সঙ্গের কৃত্রিম দৃশ্যপট · প্রকৃত HA ইঞ্জিন · মেমরিতে ডিভাইস কলব্যাক</text><text x="340" y="207" font-size="15" fill="#486078" font-weight="700" text-anchor="middle">শুরু</text><text x="700" y="207" font-size="15" fill="#486078" font-weight="700" text-anchor="middle">ঘটনা / কাজ</text><text x="1080" y="207" font-size="15" fill="#486078" font-weight="700" text-anchor="middle">শেষ</text><rect x="40" y="236" width="1120" height="147" rx="16" fill="white" stroke="#cbd8e5"/><path d="M316 282 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="288" font-size="17" fill="#486078" font-weight="400" text-anchor="start">ON</text><path d="M316 343 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="349" font-size="17" fill="#486078" font-weight="400" text-anchor="start">OFF</text><rect x="40" y="409" width="1120" height="147" rx="16" fill="white" stroke="#cbd8e5"/><path d="M316 455 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="461" font-size="17" fill="#486078" font-weight="400" text-anchor="start">ON</text><path d="M316 516 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="522" font-size="17" fill="#486078" font-weight="400" text-anchor="start">OFF</text><path d="M700 224 V583" fill="none" stroke="#486078" stroke-width="2" stroke-dasharray="5 6"/><text x="62" y="284" font-size="22" fill="#116f93" font-weight="700" text-anchor="start">পুরোনো হার্ডওয়্যার</text><text x="62" y="347" font-size="17" fill="#486078" font-weight="400" text-anchor="start">কোনো নির্দেশ নয়</text><text x="62" y="457" font-size="22" fill="#7052b5" font-weight="700" text-anchor="start">প্রতিস্থাপক ভূমিকা</text><text x="62" y="520" font-size="17" fill="#486078" font-weight="400" text-anchor="start">একটি turn_off কল</text><path d="M340 282 H1080" fill="none" stroke="#116f93" stroke-width="6"/><path d="M340 455 H700 V516 H1080" fill="none" stroke="#7052b5" stroke-width="6"/><circle cx="340" cy="282" r="8" fill="#116f93"/><circle cx="1080" cy="282" r="8" fill="#116f93"/><circle cx="340" cy="455" r="8" fill="#7052b5"/><circle cx="1080" cy="516" r="8" fill="#7052b5"/><text x="600" y="612" font-size="19" fill="#15283f" font-weight="600" text-anchor="middle">যৌক্তিক ক্রম (মাপা সময়ের অক্ষ নয়)</text><rect x="40" y="647" width="548" height="110" rx="16" fill="#eee8fa" stroke="none"/><text x="60" y="679" font-size="14" fill="#7052b5" font-weight="700" text-anchor="start">প্রত্যাশিত কল</text><text x="60" y="711" font-size="19" fill="#7052b5" font-weight="600" text-anchor="start">switch.turn_off → switch.scenario_table</text><text x="60" y="739" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">শেষ অবস্থা: off</text><rect x="612" y="647" width="548" height="110" rx="16" fill="#e2f3fb" stroke="none"/><text x="632" y="679" font-size="14" fill="#116f93" font-weight="700" text-anchor="start">নিষিদ্ধ কল</text><text x="632" y="711" font-size="19" fill="#116f93" font-weight="600" text-anchor="start">turn_off → switch.scenario_retired_plug</text><text x="632" y="739" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">শেষ অবস্থা: on</text><text x="40" y="802" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">পরীক্ষায় ঘটনার আগে 40 ms ও স্থির হতে 100 ms চাওয়া হয়; এটি মাপা বিলম্ব নয়।</text><text x="40" y="838" font-size="16" fill="#486078" font-weight="400" text-anchor="start">উৎস: role-transfer.scenario.json। চিত্রটি বাস্তব রিলে বা বিদ্যুৎ পৌঁছানো পরীক্ষা করে না।</text></g></svg>

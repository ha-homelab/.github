<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 874" lang="bn" role="img" aria-labelledby="visual-bn-874-title visual-bn-874-desc">
<title id="visual-bn-874-title">প্রস্তাবিত পরিবর্তন থেকে পর্যালোচিত প্রমাণ</title><desc id="visual-bn-874-desc">প্রাসঙ্গিক স্বাধীন পরীক্ষা বাছুন, আউটপুট দেখুন, তারপর পৃথক বাস্তব যাচাই করুন। তীর মানুষের কাজ হস্তান্তর, স্থাপিত পাইপলাইন নয়।</desc><rect width="1200" height="874" fill="#f5f8fc"/><g font-family="Arial, DejaVu Sans, sans-serif"><rect x="0" y="0" width="1200" height="152" rx="0" fill="#15283f" stroke="none"/><rect x="40" y="30" width="6" height="92" rx="3" fill="#43d0bd" stroke="none"/><text x="62" y="49" font-size="15" fill="#91e4da" font-weight="650" text-anchor="start">HA HOMELAB / 01</text><text x="62" y="91" font-size="32" fill="white" font-weight="700" text-anchor="start">প্রস্তাবিত পরিবর্তন থেকে পর্যালোচিত প্রমাণ</text><text x="62" y="125" font-size="17" fill="#d4e1ef" font-weight="400" text-anchor="start">চার সরঞ্জাম। স্পষ্ট ইনপুট। স্থাপনের আগে পর্যালোচনা।</text><rect x="40" y="180" width="1120" height="59" rx="16" fill="#e6edf5" stroke="none"/><text x="600" y="217" font-size="21" fill="#15283f" font-weight="600" text-anchor="middle">01  স্থানীয় ইনপুট তৈরি ও প্রাসঙ্গিক পরীক্ষা বাছাই</text><path d="M171 239 L171 270" fill="none" stroke="#486078" stroke-width="2"/><path d="M166 262 L171 270 L176 262" fill="none" stroke="#486078" stroke-width="2"/><rect x="40" y="279" width="262" height="284" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="279" width="262" height="8" rx="4" fill="#116f93" stroke="none"/><text x="58" y="323" font-size="21" fill="#116f93" font-weight="700" text-anchor="start">Entity Migrations</text><text x="58" y="359" font-size="19" fill="#15283f" font-weight="600" text-anchor="start">কী সরবে?</text><text x="58" y="396" font-size="18" fill="#486078" font-weight="400" text-anchor="start">ম্যানিফেস্ট, বর্তমান চিত্র ও</text><text x="58" y="421" font-size="18" fill="#486078" font-weight="400" text-anchor="start">সমর্থিত উৎস ফাইল</text><rect x="54" y="497" width="234" height="48" rx="8" fill="#e2f3fb" stroke="none"/><text x="171" y="527" font-size="17" fill="#116f93" font-weight="650" text-anchor="middle">পরিকল্পনা + বিরোধ</text><path d="M171 563 L171 597" fill="none" stroke="#486078" stroke-width="2"/><path d="M166 589 L171 597 L176 589" fill="none" stroke="#486078" stroke-width="2"/><path d="M457 239 L457 270" fill="none" stroke="#486078" stroke-width="2"/><path d="M452 262 L457 270 L462 262" fill="none" stroke="#486078" stroke-width="2"/><rect x="326" y="279" width="262" height="284" rx="16" fill="white" stroke="#cbd8e5"/><rect x="326" y="279" width="262" height="8" rx="4" fill="#087967" stroke="none"/><text x="344" y="323" font-size="21" fill="#087967" font-weight="700" text-anchor="start">Meter Contracts</text><text x="344" y="359" font-size="19" fill="#15283f" font-weight="600" text-anchor="start">কী মাপা হয়?</text><text x="344" y="396" font-size="18" fill="#486078" font-weight="400" text-anchor="start">মিটারের বিন্যাস, সময়, একক ও</text><text x="344" y="421" font-size="18" fill="#486078" font-weight="400" text-anchor="start">উৎস পরিচয়</text><rect x="340" y="497" width="234" height="48" rx="8" fill="#e0f4ec" stroke="none"/><text x="457" y="527" font-size="17" fill="#087967" font-weight="650" text-anchor="middle">ফল + বৈধ যোগফল</text><path d="M457 563 L457 597" fill="none" stroke="#486078" stroke-width="2"/><path d="M452 589 L457 597 L462 589" fill="none" stroke="#486078" stroke-width="2"/><path d="M743 239 L743 270" fill="none" stroke="#486078" stroke-width="2"/><path d="M738 262 L743 270 L748 262" fill="none" stroke="#486078" stroke-width="2"/><rect x="612" y="279" width="262" height="284" rx="16" fill="white" stroke="#cbd8e5"/><rect x="612" y="279" width="262" height="8" rx="4" fill="#7052b5" stroke="none"/><text x="630" y="323" font-size="21" fill="#7052b5" font-weight="700" text-anchor="start">Scenario Tests</text><text x="630" y="359" font-size="19" fill="#15283f" font-weight="600" text-anchor="start">HA কী করবে?</text><text x="630" y="396" font-size="18" fill="#486078" font-weight="400" text-anchor="start">কৃত্রিম ক্রম, শুরুর অবস্থা ও</text><text x="630" y="421" font-size="18" fill="#486078" font-weight="400" text-anchor="start">যাচাই</text><rect x="626" y="497" width="234" height="48" rx="8" fill="#eee8fa" stroke="none"/><text x="743" y="527" font-size="17" fill="#7052b5" font-weight="650" text-anchor="middle">কল + শেষ অবস্থা</text><path d="M743 563 L743 597" fill="none" stroke="#486078" stroke-width="2"/><path d="M738 589 L743 597 L748 589" fill="none" stroke="#486078" stroke-width="2"/><path d="M1029 239 L1029 270" fill="none" stroke="#486078" stroke-width="2"/><path d="M1024 262 L1029 270 L1034 262" fill="none" stroke="#486078" stroke-width="2"/><rect x="898" y="279" width="262" height="284" rx="16" fill="white" stroke="#cbd8e5"/><rect x="898" y="279" width="262" height="8" rx="4" fill="#b54537" stroke="none"/><text x="916" y="323" font-size="21" fill="#b54537" font-weight="700" text-anchor="start">Assist Scenario Lab</text><text x="916" y="359" font-size="19" fill="#15283f" font-weight="600" text-anchor="start">কী দেখা গেছে?</text><text x="916" y="396" font-size="18" fill="#486078" font-weight="400" text-anchor="start">উদ্দেশ্য, কাজ ও শ্রবণযোগ্য</text><text x="916" y="421" font-size="18" fill="#486078" font-weight="400" text-anchor="start">উত্তরের স্থানীয় রেকর্ড</text><rect x="912" y="497" width="234" height="48" rx="8" fill="#fcece5" stroke="none"/><text x="1029" y="527" font-size="17" fill="#b54537" font-weight="650" text-anchor="middle">ফল + প্রমাণের ঘাটতি</text><path d="M1029 563 L1029 597" fill="none" stroke="#486078" stroke-width="2"/><path d="M1024 589 L1029 597 L1034 589" fill="none" stroke="#486078" stroke-width="2"/><rect x="40" y="606" width="1120" height="85" rx="16" fill="#15283f" stroke="none"/><text x="62" y="641" font-size="24" fill="white" font-weight="650" text-anchor="start">02  পরিসর, বিরোধ ও অনুপস্থিত প্রমাণ পর্যালোচনা</text><text x="62" y="674" font-size="18" fill="#d4e1ef" font-weight="400" text-anchor="start">পরিবর্তনের সঙ্গে রিপোর্ট রাখুন; ভুল ইনপুট ঠিক করে প্রাসঙ্গিক পরীক্ষা আবার চালান।</text><path d="M40 723 H1160" fill="none" stroke="#b54537" stroke-width="2" stroke-dasharray="8 7"/><text x="40" y="763" font-size="25" fill="#b54537" font-weight="650" text-anchor="start">03  পর্যালোচনার পরে স্থাপন, তারপর প্রকৃত ডিভাইস যাচাই</text><text x="40" y="797" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">রেডিও পৌঁছানো · রিলে সংযোগ · প্রকৃত লোড · উৎস সময় · শ্রবণযোগ্য শব্দ</text><text x="40" y="843" font-size="16" fill="#486078" font-weight="400" text-anchor="start">তীর মানুষের পর্যালোচনা হস্তান্তর বোঝায়। সরঞ্জামগুলো স্বয়ংক্রিয় স্থাপন করে না।</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 874" lang="cs" role="img" aria-labelledby="visual-cs-874-title visual-cs-874-desc">
<title id="visual-cs-874-title">Od návrhu změny k prověřeným důkazům</title><desc id="visual-cs-874-desc">Vyberte vhodné nezávislé kontroly, posuďte výstupy a pak proveďte samostatnou fyzickou přejímku. Šipky značí předání lidmi, nikoli nasazenou pipeline.</desc><rect width="1200" height="874" fill="#f5f8fc"/><g font-family="Arial, DejaVu Sans, sans-serif"><rect x="0" y="0" width="1200" height="152" rx="0" fill="#15283f" stroke="none"/><rect x="40" y="30" width="6" height="92" rx="3" fill="#43d0bd" stroke="none"/><text x="62" y="49" font-size="15" fill="#91e4da" font-weight="650" text-anchor="start">HA HOMELAB / 01</text><text x="62" y="91" font-size="32" fill="white" font-weight="700" text-anchor="start">Od návrhu změny k prověřeným důkazům</text><text x="62" y="125" font-size="17" fill="#d4e1ef" font-weight="400" text-anchor="start">Čtyři nástroje. Výslovné vstupy. Revize před nasazením.</text><rect x="40" y="180" width="1120" height="59" rx="16" fill="#e6edf5" stroke="none"/><text x="600" y="217" font-size="21" fill="#15283f" font-weight="600" text-anchor="middle">01  Připravte místní vstupy a vyberte relevantní kontroly</text><path d="M171 239 L171 270" fill="none" stroke="#486078" stroke-width="2"/><path d="M166 262 L171 270 L176 262" fill="none" stroke="#486078" stroke-width="2"/><rect x="40" y="279" width="262" height="284" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="279" width="262" height="8" rx="4" fill="#116f93" stroke="none"/><text x="58" y="323" font-size="21" fill="#116f93" font-weight="700" text-anchor="start">Entity Migrations</text><text x="58" y="359" font-size="19" fill="#15283f" font-weight="600" text-anchor="start">Co se má přesunout?</text><text x="58" y="396" font-size="18" fill="#486078" font-weight="400" text-anchor="start">Manifest, snímek a</text><text x="58" y="421" font-size="18" fill="#486078" font-weight="400" text-anchor="start">podporované zdrojové</text><text x="58" y="446" font-size="18" fill="#486078" font-weight="400" text-anchor="start">soubory</text><rect x="54" y="497" width="234" height="48" rx="8" fill="#e2f3fb" stroke="none"/><text x="171" y="527" font-size="17" fill="#116f93" font-weight="650" text-anchor="middle">Plán + konflikty</text><path d="M171 563 L171 597" fill="none" stroke="#486078" stroke-width="2"/><path d="M166 589 L171 597 L176 589" fill="none" stroke="#486078" stroke-width="2"/><path d="M457 239 L457 270" fill="none" stroke="#486078" stroke-width="2"/><path d="M452 262 L457 270 L462 262" fill="none" stroke="#486078" stroke-width="2"/><rect x="326" y="279" width="262" height="284" rx="16" fill="white" stroke="#cbd8e5"/><rect x="326" y="279" width="262" height="8" rx="4" fill="#087967" stroke="none"/><text x="344" y="323" font-size="21" fill="#087967" font-weight="700" text-anchor="start">Meter Contracts</text><text x="344" y="359" font-size="19" fill="#15283f" font-weight="600" text-anchor="start">Co se měří?</text><text x="344" y="396" font-size="18" fill="#486078" font-weight="400" text-anchor="start">Topologie měřidel, čas,</text><text x="344" y="421" font-size="18" fill="#486078" font-weight="400" text-anchor="start">jednotky a identita</text><text x="344" y="446" font-size="18" fill="#486078" font-weight="400" text-anchor="start">zdroje</text><rect x="340" y="497" width="234" height="48" rx="8" fill="#e0f4ec" stroke="none"/><text x="457" y="527" font-size="17" fill="#087967" font-weight="650" text-anchor="middle">Nálezy + platné součty</text><path d="M457 563 L457 597" fill="none" stroke="#486078" stroke-width="2"/><path d="M452 589 L457 597 L462 589" fill="none" stroke="#486078" stroke-width="2"/><path d="M743 239 L743 270" fill="none" stroke="#486078" stroke-width="2"/><path d="M738 262 L743 270 L748 262" fill="none" stroke="#486078" stroke-width="2"/><rect x="612" y="279" width="262" height="284" rx="16" fill="white" stroke="#cbd8e5"/><rect x="612" y="279" width="262" height="8" rx="4" fill="#7052b5" stroke="none"/><text x="630" y="323" font-size="21" fill="#7052b5" font-weight="700" text-anchor="start">Scenario Tests</text><text x="630" y="359" font-size="19" fill="#15283f" font-weight="600" text-anchor="start">Co udělá HA?</text><text x="630" y="396" font-size="18" fill="#486078" font-weight="400" text-anchor="start">Syntetický průběh,</text><text x="630" y="421" font-size="18" fill="#486078" font-weight="400" text-anchor="start">počáteční stavy a</text><text x="630" y="446" font-size="18" fill="#486078" font-weight="400" text-anchor="start">tvrzení</text><rect x="626" y="497" width="234" height="48" rx="8" fill="#eee8fa" stroke="none"/><text x="743" y="527" font-size="17" fill="#7052b5" font-weight="650" text-anchor="middle">Volání + konečné stavy</text><path d="M743 563 L743 597" fill="none" stroke="#486078" stroke-width="2"/><path d="M738 589 L743 597 L748 589" fill="none" stroke="#486078" stroke-width="2"/><path d="M1029 239 L1029 270" fill="none" stroke="#486078" stroke-width="2"/><path d="M1024 262 L1029 270 L1034 262" fill="none" stroke="#486078" stroke-width="2"/><rect x="898" y="279" width="262" height="284" rx="16" fill="white" stroke="#cbd8e5"/><rect x="898" y="279" width="262" height="8" rx="4" fill="#b54537" stroke="none"/><text x="916" y="323" font-size="21" fill="#b54537" font-weight="700" text-anchor="start">Assist Scenario Lab</text><text x="916" y="359" font-size="19" fill="#15283f" font-weight="600" text-anchor="start">Co bylo pozorováno?</text><text x="916" y="396" font-size="18" fill="#486078" font-weight="400" text-anchor="start">Místní záznamy záměru,</text><text x="916" y="421" font-size="18" fill="#486078" font-weight="400" text-anchor="start">akce a slyšitelné</text><text x="916" y="446" font-size="18" fill="#486078" font-weight="400" text-anchor="start">odpovědi</text><rect x="912" y="497" width="234" height="48" rx="8" fill="#fcece5" stroke="none"/><text x="1029" y="516" font-size="17" fill="#b54537" font-weight="650" text-anchor="middle">Výsledek + mezery v</text><text x="1029" y="538" font-size="17" fill="#b54537" font-weight="650" text-anchor="middle">důkazech</text><path d="M1029 563 L1029 597" fill="none" stroke="#486078" stroke-width="2"/><path d="M1024 589 L1029 597 L1034 589" fill="none" stroke="#486078" stroke-width="2"/><rect x="40" y="606" width="1120" height="85" rx="16" fill="#15283f" stroke="none"/><text x="62" y="641" font-size="24" fill="white" font-weight="650" text-anchor="start">02  Posuďte rozsah, konflikty a chybějící důkazy</text><text x="62" y="674" font-size="18" fill="#d4e1ef" font-weight="400" text-anchor="start">Uchovejte zprávy se změnou, opravte neplatné vstupy a opakujte příslušné kontroly.</text><path d="M40 723 H1160" fill="none" stroke="#b54537" stroke-width="2" stroke-dasharray="8 7"/><text x="40" y="763" font-size="25" fill="#b54537" font-weight="650" text-anchor="start">03  Nasaďte po revizi, pak ověřte skutečné zařízení</text><text x="40" y="797" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">Rádiové doručení · kontakty relé · skutečná zátěž · čas zdroje · slyšitelný zvuk</text><text x="40" y="843" font-size="16" fill="#486078" font-weight="400" text-anchor="start">Šipky = předání při lidské revizi. Nástroje netvoří automatickou pipeline nasazení.</text></g></svg>

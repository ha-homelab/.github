<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 715" role="img" aria-labelledby="title desc">
<title id="title">Evidence before automation</title><desc id="desc">Four tools: entity migration planning, meter contracts, a real Home Assistant synthetic scenario engine and voice evidence evaluation. Arrows describe human review handoffs, not automatic integrations. Physical acceptance and deployment remain separate.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#175f9b"/></marker></defs><rect width="1100" height="715" fill="white"/><g font-family="system-ui, sans-serif"><text x="38" y="43" font-size="30" fill="#172b3a" font-weight="650">Evidence before automation</text><text x="38" y="78" font-size="20" fill="#526574" font-weight="400">Four separate tools · local files · synthetic fixtures · review handoffs</text><rect x="38" y="117" width="470" height="148" rx="10" fill="#f7f9fb" stroke="#175f9b" stroke-width="2"/><text x="58" y="151" font-size="23" fill="#175f9b" font-weight="650">1. Entity migration plan</text><text x="58" y="184" font-size="18" fill="#526574" font-weight="400">Role + hardware + capabilities + fingerprints</text><text x="58" y="211" font-size="18" fill="#526574" font-weight="400">Output: ready or blocked changes</text><text x="58" y="238" font-size="18" fill="#526574" font-weight="400">Question: what should move?</text><rect x="592" y="117" width="470" height="148" rx="10" fill="#f7f9fb" stroke="#175f9b" stroke-width="2"/><text x="612" y="151" font-size="23" fill="#175f9b" font-weight="650">2. Meter contracts</text><text x="612" y="184" font-size="18" fill="#526574" font-weight="400">Physical scope + provenance + sample quality</text><text x="612" y="211" font-size="18" fill="#526574" font-weight="400">Output: findings and eligible sums</text><text x="612" y="238" font-size="18" fill="#526574" font-weight="400">Question: what does this value cover?</text><rect x="38" y="331" width="470" height="148" rx="10" fill="#f7f9fb" stroke="#175f9b" stroke-width="2"/><text x="58" y="365" font-size="23" fill="#175f9b" font-weight="650">3. Real HA scenario engine</text><text x="58" y="398" font-size="18" fill="#526574" font-weight="400">Reviewed synthetic timeline + assertions</text><text x="58" y="425" font-size="18" fill="#526574" font-weight="400">Output: ordered calls and final states</text><text x="58" y="452" font-size="18" fill="#526574" font-weight="400">Question: what does this sequence do?</text><rect x="592" y="331" width="470" height="148" rx="10" fill="#f7f9fb" stroke="#175f9b" stroke-width="2"/><text x="612" y="365" font-size="23" fill="#175f9b" font-weight="650">4. Voice evidence</text><text x="612" y="398" font-size="18" fill="#526574" font-weight="400">Recorded action + API + audible observation</text><text x="612" y="425" font-size="18" fill="#526574" font-weight="400">Output: pass, fail or incomplete evidence</text><text x="612" y="452" font-size="18" fill="#526574" font-weight="400">Question: was the requested outcome seen?</text><path d="M273 268 L273 324" stroke="#175f9b" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><text x="289" y="303" font-size="17" fill="#175f9b" font-weight="400">Reviewed handoff</text><text x="617" y="303" font-size="17" fill="#175f9b" font-weight="400">Independent evidence checks</text><path d="M38 525 H1062" stroke="#a52a2a" stroke-width="2" stroke-dasharray="8 6"/><text x="38" y="559" font-size="24" fill="#a52a2a" font-weight="650">Physical acceptance remains a separate step</text><text x="38" y="593" font-size="20" fill="#526574" font-weight="400">Radio delivery · relay/contact behavior · actual load · water flow · audible sound</text><text x="38" y="630" font-size="19" fill="#172b3a" font-weight="400">No automatic deployment. No whole-strip watts claimed as one outlet. No unknown = success.</text><text x="38" y="684" font-size="15" fill="#526574" font-weight="400">Original synthetic architecture · MIT · Reproduce with render_architecture.py</text></g></svg>

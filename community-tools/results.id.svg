<title id="visual-id-949-title">Masukan, pemeriksaan, dan hasil</title><desc id="visual-id-949-desc">Ringkasan ilustratif masukan, pemeriksaan, dan keluaran. Hitungan sintetis: 700 W + 0.02 kW + 0 W = 720 W. Bukan tangkapan laporan mentah.</desc><rect width="1200" height="949" fill="#f5f8fc"/><g font-family="Arial, DejaVu Sans, sans-serif"><rect x="0" y="0" width="1200" height="152" rx="0" fill="#15283f" stroke="none"/><rect x="40" y="30" width="6" height="92" rx="3" fill="#43d0bd" stroke="none"/><text x="62" y="49" font-size="15" fill="#91e4da" font-weight="650" text-anchor="start">HA HOMELAB / 02</text><text x="62" y="91" font-size="32" fill="white" font-weight="700" text-anchor="start">Masukan, pemeriksaan, dan hasil</text><text x="62" y="125" font-size="17" fill="#d4e1ef" font-weight="400" text-anchor="start">Ringkasan ilustratif contoh sintetis bawaan</text><text x="62" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">ALAT</text><text x="280" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">MASUKAN</text><text x="592" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">PEMERIKSAAN</text><text x="913" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">HASIL</text><rect x="40" y="222" width="1120" height="137" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="222" width="207" height="137" rx="16" fill="#e2f3fb" stroke="none"/><text x="60" y="270" font-size="21" fill="#116f93" font-weight="700" text-anchor="start">Entity</text><text x="60" y="298" font-size="21" fill="#116f93" font-weight="700" text-anchor="start">Migrations</text><text x="280" y="259" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">light.table → switch.table</text><text x="592" y="259" font-size="18" fill="#486078" font-weight="400" text-anchor="start">Periksa kebijakan peran,</text><text x="592" y="284" font-size="18" fill="#486078" font-weight="400" text-anchor="start"
ont-size="18" fill="#486078" font-weight="400" text-anchor="start">callback sintetis dan</text><text x="592" y="619" font-size="18" fill="#486078" font-weight="400" text-anchor="start">asersi presisi</text><text x="913" y="569" font-size="18" fill="#7052b5" font-weight="600" text-anchor="start">1 panggilan</text><text x="913" y="594" font-size="18" fill="#7052b5" font-weight="600" text-anchor="start">diharapkan; baru OFF,</text><text x="913" y="619" font-size="18" fill="#7052b5" font-weight="600" text-anchor="start">lama tetap ON</text><rect x="40" y="687" width="1120" height="137" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="687" width="207" height="137" rx="16" fill="#fcece5" stroke="none"/><text x="60" y="735" font-size="21" fill="#b54537" font-weight="700" text-anchor="start">Assist Scenario</text><text x="60" y="763" font-size="21" fill="#b54537" font-weight="700" text-anchor="start">Lab</text><text x="280" y="724" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">API selesai; pengamatan</text><text x="280" y="749" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">suara hilang</text><text x="592" y="724" font-size="18" fill="#486078" font-weight="400" text-anchor="start">Nilai ketepatan, tindakan,</text><text x="592" y="749" font-size="18" fill="#486078" font-weight="400" text-anchor="start">dan keterdengaran terpisah</text><text x="913" y="724" font-size="18" fill="#b54537" font-weight="600" text-anchor="start">Bukti belum lengkap;</text><text x="913" y="749" font-size="18" fill="#b54537" font-weight="600" text-anchor="start">contoh keluar dengan</text><text x="913" y="774" font-size="18" fill="#b54537" font-weight="600" text-anchor="start">kode 3</text><text x="40" y="884" font-size="18" fill="#15283f" font-weight="600" text-anchor="start">Jumlah valid, rencana siap, skenario lulus, dan bukti suara menjawab pertanyaan berbeda.</text><text x="40" y="919" font-size="16" fill="#486078" font-weight="400" text-anchor="
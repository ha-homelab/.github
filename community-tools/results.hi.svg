"913" y="259" font-size="18" fill="#116f93" font-weight="600" text-anchor="start">समीक्षा योग्य योजना; विरोध</text><text x="913" y="284" font-size="18" fill="#116f93" font-weight="600" text-anchor="start">तैयारी रोकते हैं</text><rect x="40" y="377" width="1120" height="137" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="377" width="207" height="137" rx="16" fill="#e0f4ec" stroke="none"/><text x="60" y="425" font-size="21" fill="#087967" font-weight="700" text-anchor="start">Meter Contracts</text><text x="280" y="414" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">700 W + 0.02 kW + 0 W</text><text x="592" y="414" font-size="18" fill="#486078" font-weight="400" text-anchor="start">इकाइयाँ मिलाएँ; ताज़गी और अलग</text><text x="592" y="439" font-size="18" fill="#486078" font-weight="400" text-anchor="start">स्रोत जाँचें</text><text x="913" y="414" font-size="18" fill="#087967" font-weight="600" text-anchor="start">कुल 720 W; साझा और दोहरे</text><text x="913" y="439" font-size="18" fill="#087967" font-weight="600" text-anchor="start">स्रोत देखें</text><rect x="40" y="532" width="1120" height="137" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="532" width="207" height="137" rx="16" fill="#eee8fa" stroke="none"/><text x="60" y="580" font-size="21" fill="#7052b5" font-weight="700" text-anchor="start">Scenario Tests</text><text x="280" y="569" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">scenario_table_off</text><text x="592" y="569" font-size="18" fill="#486078" font-weight="400" text-anchor="start">कृत्रिम कॉलबैक और सटीक</text><text x="592" y="594" font-size="18" fill="#486078" font-weight="400" text-anchor="start">assertions से असली HA चलाएँ</text><text x="913" y="569" font-size="18" fill="#7052b5" font-weight="600" text-anchor="start">1 अपेक्षित कॉल; नया बंद,</text><text x="913" y="594" font-size="18" fill="#7052b5" font-weight="600" text-anchor="start">पुराना प्लग चालू</text><rect x="40" y="687" width="1120" hei
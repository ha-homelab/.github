<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 949" lang="it" role="img" aria-labelledby="visual-it-949-title visual-it-949-desc">
<title id="visual-it-949-title">Input, verifiche e risultati</title><desc id="visual-it-949-desc">Riepiloghi illustrati di input, verifiche e output. Calcolo sintetico: 700 W più 0.02 kW più 0 W uguale 720 W. Non sono schermate di report grezzi.</desc><rect width="1200" height="949" fill="#f5f8fc"/><g font-family="Arial, DejaVu Sans, sans-serif"><rect x="0" y="0" width="1200" height="152" rx="0" fill="#15283f" stroke="none"/><rect x="40" y="30" width="6" height="92" rx="3" fill="#43d0bd" stroke="none"/><text x="62" y="49" font-size="15" fill="#91e4da" font-weight="650" text-anchor="start">HA HOMELAB / 02</text><text x="62" y="91" font-size="32" fill="white" font-weight="700" text-anchor="start">Input, verifiche e risultati</text><text x="62" y="125" font-size="17" fill="#d4e1ef" font-weight="400" text-anchor="start">Riepiloghi illustrati degli esempi sintetici inclusi</text><text x="62" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">STRUMENTO</text><text x="280" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">INPUT</text><text x="592" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">VERIFICA / PROCESSO</text><text x="913" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">RISULTATO</text><rect x="40" y="222" width="1120" height="137" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="222" width="207" height="137" rx="16" fill="#e2f3fb" stroke="none"/><text x="60" y="270" font-size="21" fill="#116f93" font-weight="700" text-anchor="start">Entity</text><text x="60" y="298" font-size="21" fill="#116f93" font-weight="700" text-anchor="start">Migrations</text><text x="280" y="259" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">light.table → switch.table</text><text x="592" y="259" font-size="18" fill="#486078" font-weight="400" text-anchor="start">Verifica policy dei ruoli,</text><text x="592" y="284" font-size="18" fill="#486078" font-weight="400" text-anchor="start">capacità e riferimenti</text><text x="592" y="309" font-size="18" fill="#486078" font-weight="400" text-anchor="start">supportati</text><text x="913" y="259" font-size="18" fill="#116f93" font-weight="600" text-anchor="start">Piano revisionabile; i</text><text x="913" y="284" font-size="18" fill="#116f93" font-weight="600" text-anchor="start">conflitti ne bloccano</text><text x="913" y="309" font-size="18" fill="#116f93" font-weight="600" text-anchor="start">la prontezza</text><rect x="40" y="377" width="1120" height="137" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="377" width="207" height="137" rx="16" fill="#e0f4ec" stroke="none"/><text x="60" y="425" font-size="21" fill="#087967" font-weight="700" text-anchor="start">Meter Contracts</text><text x="280" y="414" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">700 W + 0.02 kW + 0 W</text><text x="592" y="414" font-size="18" fill="#486078" font-weight="400" text-anchor="start">Normalizza unità; verifica</text><text x="592" y="439" font-size="18" fill="#486078" font-weight="400" text-anchor="start">attualità e fonti distinte</text><text x="913" y="414" font-size="18" fill="#087967" font-weight="600" text-anchor="start">720 W totali; esamina</text><text x="913" y="439" font-size="18" fill="#087967" font-weight="600" text-anchor="start">fonti condivise e</text><text x="913" y="464" font-size="18" fill="#087967" font-weight="600" text-anchor="start">duplicate</text><rect x="40" y="532" width="1120" height="137" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="532" width="207" height="137" rx="16" fill="#eee8fa" stroke="none"/><text x="60" y="580" font-size="21" fill="#7052b5" font-weight="700" text-anchor="start">Scenario Tests</text><text x="280" y="569" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">scenario_table_off</text><text x="592" y="569" font-size="18" fill="#486078" font-weight="400" text-anchor="start">Esegui HA reale con</text><text x="592" y="594" font-size="18" fill="#486078" font-weight="400" text-anchor="start">callback sintetici e</text><text x="592" y="619" font-size="18" fill="#486078" font-weight="400" text-anchor="start">asserzioni esatte</text><text x="913" y="569" font-size="18" fill="#7052b5" font-weight="600" text-anchor="start">1 chiamata attesa;</text><text x="913" y="594" font-size="18" fill="#7052b5" font-weight="600" text-anchor="start">nuovo SPENTO, vecchia</text><text x="913" y="619" font-size="18" fill="#7052b5" font-weight="600" text-anchor="start">presa ACCESA</text><rect x="40" y="687" width="1120" height="137" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="687" width="207" height="137" rx="16" fill="#fcece5" stroke="none"/><text x="60" y="735" font-size="21" fill="#b54537" font-weight="700" text-anchor="start">Assist Scenario</text><text x="60" y="763" font-size="21" fill="#b54537" font-weight="700" text-anchor="start">Lab</text><text x="280" y="724" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">API completata; manca</text><text x="280" y="749" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">l’osservazione udibile</text><text x="592" y="724" font-size="18" fill="#486078" font-weight="400" text-anchor="start">Valuta separatamente</text><text x="592" y="749" font-size="18" fill="#486078" font-weight="400" text-anchor="start">correttezza, azione e</text><text x="592" y="774" font-size="18" fill="#486078" font-weight="400" text-anchor="start">udibilità</text><text x="913" y="724" font-size="18" fill="#b54537" font-weight="600" text-anchor="start">Evidenze incomplete;</text><text x="913" y="749" font-size="18" fill="#b54537" font-weight="600" text-anchor="start">l’esempio termina con</text><text x="913" y="774" font-size="18" fill="#b54537" font-weight="600" text-anchor="start">codice 3</text><text x="40" y="884" font-size="18" fill="#15283f" font-weight="600" text-anchor="start">Una somma valida, un piano pronto, uno scenario superato ed evidenze udibili rispondono a domande diverse.</text><text x="40" y="919" font-size="16" fill="#486078" font-weight="400" text-anchor="start">Fonti e comandi esatti: process-and-results.it.md.</text></g></svg>

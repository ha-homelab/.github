<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 868" lang="zh-Hant" role="img" aria-labelledby="visual-zh-Hant-868-title visual-zh-Hant-868-desc">
<title id="visual-zh-Hant-868-title">角色遷移：一個事件，兩種結果</title><desc id="visual-zh-Hant-868-desc">舊設備保持開啟。一個事件關閉替代設備。預期恰好一次呼叫，禁止關閉舊設備。邏輯階段不是實際耗時測量。</desc><rect width="1200" height="868" fill="#f5f8fc"/><g font-family="Arial, DejaVu Sans, sans-serif"><rect x="0" y="0" width="1200" height="152" rx="0" fill="#15283f" stroke="none"/><rect x="40" y="30" width="6" height="92" rx="3" fill="#43d0bd" stroke="none"/><text x="62" y="49" font-size="15" fill="#91e4da" font-weight="650" text-anchor="start">HA HOMELAB / 04</text><text x="62" y="91" font-size="32" fill="white" font-weight="700" text-anchor="start">角色遷移：一個事件，兩種結果</text><text x="62" y="125" font-size="17" fill="#d4e1ef" font-weight="400" text-anchor="start">隨附合成場景 · 真實 HA 引擎 · 記憶體中的設備回呼</text><text x="340" y="207" font-size="15" fill="#486078" font-weight="700" text-anchor="middle">初始</text><text x="700" y="207" font-size="15" fill="#486078" font-weight="700" text-anchor="middle">事件 / 動作</text><text x="1080" y="207" font-size="15" fill="#486078" font-weight="700" text-anchor="middle">最終</text><rect x="40" y="236" width="1120" height="147" rx="16" fill="white" stroke="#cbd8e5"/><path d="M316 282 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="288" font-size="17" fill="#486078" font-weight="400" text-anchor="start">ON</text><path d="M316 343 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="349" font-size="17" fill="#486078" font-weight="400" text-anchor="start">OFF</text><rect x="40" y="409" width="1120" height="147" rx="16" fill="white" stroke="#cbd8e5"/><path d="M316 455 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="461" font-size="17" fill="#486078" font-weight="400" text-anchor="start">ON</text><path d="M316 516 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="522" font-size="17" fill="#486078" font-weight="400" text-anchor="start">OFF</text><path d="M700 224 V583" fill="none" stroke="#486078" stroke-width="2" stroke-dasharray="5 6"/><text x="62" y="284" font-size="22" fill="#116f93" font-weight="700" text-anchor="start">舊硬體</text><text x="62" y="347" font-size="17" fill="#486078" font-weight="400" text-anchor="start">未發送命令</text><text x="62" y="457" font-size="22" fill="#7052b5" font-weight="700" text-anchor="start">替代角色</text><text x="62" y="520" font-size="17" fill="#486078" font-weight="400" text-anchor="start">一次 turn_off 呼叫</text><path d="M340 282 H1080" fill="none" stroke="#116f93" stroke-width="6"/><path d="M340 455 H700 V516 H1080" fill="none" stroke="#7052b5" stroke-width="6"/><circle cx="340" cy="282" r="8" fill="#116f93"/><circle cx="1080" cy="282" r="8" fill="#116f93"/><circle cx="340" cy="455" r="8" fill="#7052b5"/><circle cx="1080" cy="516" r="8" fill="#7052b5"/><text x="600" y="612" font-size="19" fill="#15283f" font-weight="600" text-anchor="middle">邏輯序列（非實測時間軸）</text><rect x="40" y="647" width="548" height="110" rx="16" fill="#eee8fa" stroke="none"/><text x="60" y="679" font-size="14" fill="#7052b5" font-weight="700" text-anchor="start">預期呼叫</text><text x="60" y="711" font-size="19" fill="#7052b5" font-weight="600" text-anchor="start">switch.turn_off → switch.scenario_table</text><text x="60" y="739" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">最終狀態：off</text><rect x="612" y="647" width="548" height="110" rx="16" fill="#e2f3fb" stroke="none"/><text x="632" y="679" font-size="14" fill="#116f93" font-weight="700" text-anchor="start">禁止呼叫</text><text x="632" y="711" font-size="19" fill="#116f93" font-weight="600" text-anchor="start">turn_off → switch.scenario_retired_plug</text><text x="632" y="739" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">最終狀態：on</text><text x="40" y="802" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">測試資料請求事件前等待 40 ms，之後穩定 100 ms；這些並非實測延遲。</text><text x="40" y="838" font-size="16" fill="#486078" font-weight="400" text-anchor="start">來源：role-transfer.scenario.json · 此圖不測試實物繼電器或供電。</text></g></svg>

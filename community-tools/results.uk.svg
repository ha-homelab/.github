<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 949" lang="uk" role="img" aria-labelledby="visual-uk-949-title visual-uk-949-desc">
<title id="visual-uk-949-title">Входи, перевірки й результати</title><desc id="visual-uk-949-desc">Ілюстровані підсумки входів, перевірок і виходів. Синтетична арифметика: 700 W плюс 0.02 kW плюс 0 W дорівнює 720 W. Не знімки необроблених звітів.</desc><rect width="1200" height="949" fill="#f5f8fc"/><g font-family="Arial, DejaVu Sans, sans-serif"><rect x="0" y="0" width="1200" height="152" rx="0" fill="#15283f" stroke="none"/><rect x="40" y="30" width="6" height="92" rx="3" fill="#43d0bd" stroke="none"/><text x="62" y="49" font-size="15" fill="#91e4da" font-weight="650" text-anchor="start">HA HOMELAB / 02</text><text x="62" y="91" font-size="32" fill="white" font-weight="700" text-anchor="start">Входи, перевірки й результати</text><text x="62" y="125" font-size="17" fill="#d4e1ef" font-weight="400" text-anchor="start">Ілюстровані підсумки включених синтетичних прикладів</text><text x="62" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">ІНСТРУМЕНТ</text><text x="280" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">ВХІД</text><text x="592" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">ПЕРЕВІРКА / ПРОЦЕС</text><text x="913" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">РЕЗУЛЬТАТ</text><rect x="40" y="222" width="1120" height="137" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="222" width="207" height="137" rx="16" fill="#e2f3fb" stroke="none"/><text x="60" y="270" font-size="21" fill="#116f93" font-weight="700" text-anchor="start">Entity</text><text x="60" y="298" font-size="21" fill="#116f93" font-weight="700" text-anchor="start">Migrations</text><text x="280" y="259" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">light.table → switch.table</text><text x="592" y="259" font-size="18" fill="#486078" font-weight="400" text-anchor="start">Перевірте правила ролей,</text><text x="592" y="284" font-size="18" fill="#486078" font-weight="400" text-anchor="start">можливості й посилання</text><text x="913" y="259" font-size="18" fill="#116f93" font-weight="600" text-anchor="start">План для перевірки;</text><text x="913" y="284" font-size="18" fill="#116f93" font-weight="600" text-anchor="start">конфлікти блокують</text><text x="913" y="309" font-size="18" fill="#116f93" font-weight="600" text-anchor="start">готовність</text><rect x="40" y="377" width="1120" height="137" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="377" width="207" height="137" rx="16" fill="#e0f4ec" stroke="none"/><text x="60" y="425" font-size="21" fill="#087967" font-weight="700" text-anchor="start">Meter Contracts</text><text x="280" y="414" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">700 W + 0.02 kW + 0 W</text><text x="592" y="414" font-size="18" fill="#486078" font-weight="400" text-anchor="start">Узгодьте одиниці; перевірте</text><text x="592" y="439" font-size="18" fill="#486078" font-weight="400" text-anchor="start">актуальність і джерела</text><text x="913" y="414" font-size="18" fill="#087967" font-weight="600" text-anchor="start">Разом 720 W; перевірте</text><text x="913" y="439" font-size="18" fill="#087967" font-weight="600" text-anchor="start">спільні й дубльовані</text><text x="913" y="464" font-size="18" fill="#087967" font-weight="600" text-anchor="start">джерела</text><rect x="40" y="532" width="1120" height="137" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="532" width="207" height="137" rx="16" fill="#eee8fa" stroke="none"/><text x="60" y="580" font-size="21" fill="#7052b5" font-weight="700" text-anchor="start">Scenario Tests</text><text x="280" y="569" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">scenario_table_off</text><text x="592" y="569" font-size="18" fill="#486078" font-weight="400" text-anchor="start">Запустіть справжній HA із</text><text x="592" y="594" font-size="18" fill="#486078" font-weight="400" text-anchor="start">синтетичними викликами й</text><text x="592" y="619" font-size="18" fill="#486078" font-weight="400" text-anchor="start">точними твердженнями</text><text x="913" y="569" font-size="18" fill="#7052b5" font-weight="600" text-anchor="start">1 очікуваний виклик;</text><text x="913" y="594" font-size="18" fill="#7052b5" font-weight="600" text-anchor="start">новий ВИМК., стара</text><text x="913" y="619" font-size="18" fill="#7052b5" font-weight="600" text-anchor="start">розетка УВІМК.</text><rect x="40" y="687" width="1120" height="137" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="687" width="207" height="137" rx="16" fill="#fcece5" stroke="none"/><text x="60" y="735" font-size="21" fill="#b54537" font-weight="700" text-anchor="start">Assist Scenario</text><text x="60" y="763" font-size="21" fill="#b54537" font-weight="700" text-anchor="start">Lab</text><text x="280" y="724" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">API завершено; чутного</text><text x="280" y="749" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">спостереження бракує</text><text x="592" y="724" font-size="18" fill="#486078" font-weight="400" text-anchor="start">Оцінюйте правильність, дію</text><text x="592" y="749" font-size="18" fill="#486078" font-weight="400" text-anchor="start">й чутність окремо</text><text x="913" y="724" font-size="18" fill="#b54537" font-weight="600" text-anchor="start">Неповні докази;</text><text x="913" y="749" font-size="18" fill="#b54537" font-weight="600" text-anchor="start">приклад завершується</text><text x="913" y="774" font-size="18" fill="#b54537" font-weight="600" text-anchor="start">кодом 3</text><text x="40" y="884" font-size="18" fill="#15283f" font-weight="600" text-anchor="start">Коректна сума, готовий план, успішний сценарій і чутні докази відповідають на різні запитання.</text><text x="40" y="919" font-size="16" fill="#486078" font-weight="400" text-anchor="start">Джерела й точні команди: process-and-results.uk.md.</text></g></svg>

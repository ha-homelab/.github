<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 949" lang="ru" role="img" aria-labelledby="visual-ru-949-title visual-ru-949-desc">
<title id="visual-ru-949-title">Что именно означает результат</title><desc id="visual-ru-949-desc">Примеры входов, проверок и выходов. Учебная сумма: 700 Вт + 0,02 кВт + 0 Вт = 720 Вт. Это не скриншоты сырых отчётов.</desc><rect width="1200" height="949" fill="#f5f8fc"/><g font-family="Arial, DejaVu Sans, sans-serif"><rect x="0" y="0" width="1200" height="152" rx="0" fill="#15283f" stroke="none"/><rect x="40" y="30" width="6" height="92" rx="3" fill="#43d0bd" stroke="none"/><text x="62" y="49" font-size="15" fill="#91e4da" font-weight="650" text-anchor="start">HA HOMELAB / 02</text><text x="62" y="91" font-size="32" fill="white" font-weight="700" text-anchor="start">Что именно означает результат</text><text x="62" y="125" font-size="17" fill="#d4e1ef" font-weight="400" text-anchor="start">Иллюстрированные результаты комплектных учебных примеров</text><text x="62" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">ИНСТРУМЕНТ</text><text x="280" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">ВХОД</text><text x="592" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">ПРОВЕРКА / ПРОЦЕСС</text><text x="913" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">РЕЗУЛЬТАТ</text><rect x="40" y="222" width="1120" height="137" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="222" width="207" height="137" rx="16" fill="#e2f3fb" stroke="none"/><text x="60" y="270" font-size="21" fill="#116f93" font-weight="700" text-anchor="start">Entity</text><text x="60" y="298" font-size="21" fill="#116f93" font-weight="700" text-anchor="start">Migrations</text><text x="280" y="259" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">light.table → switch.table</text><text x="592" y="259" font-size="18" fill="#486078" font-weight="400" text-anchor="start">Проверить роль, возможности</text><text x="592" y="284" font-size="18" fill="#486078" font-weight="400" text-anchor="start">и поддерживаемые ссылки</text><text x="913" y="259" font-size="18" fill="#116f93" font-weight="600" text-anchor="start">План для ревью;</text><text x="913" y="284" font-size="18" fill="#116f93" font-weight="600" text-anchor="start">конфликты блокируют</text><text x="913" y="309" font-size="18" fill="#116f93" font-weight="600" text-anchor="start">готовность</text><rect x="40" y="377" width="1120" height="137" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="377" width="207" height="137" rx="16" fill="#e0f4ec" stroke="none"/><text x="60" y="425" font-size="21" fill="#087967" font-weight="700" text-anchor="start">Meter Contracts</text><text x="280" y="414" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">700 W + 0.02 kW + 0 W</text><text x="592" y="414" font-size="18" fill="#486078" font-weight="400" text-anchor="start">Привести единицы; проверить</text><text x="592" y="439" font-size="18" fill="#486078" font-weight="400" text-anchor="start">свежесть и разные источники</text><text x="913" y="414" font-size="18" fill="#087967" font-weight="600" text-anchor="start">Итого 720 Вт;</text><text x="913" y="439" font-size="18" fill="#087967" font-weight="600" text-anchor="start">проверить общие и</text><text x="913" y="464" font-size="18" fill="#087967" font-weight="600" text-anchor="start">повторные источники</text><rect x="40" y="532" width="1120" height="137" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="532" width="207" height="137" rx="16" fill="#eee8fa" stroke="none"/><text x="60" y="580" font-size="21" fill="#7052b5" font-weight="700" text-anchor="start">Scenario Tests</text><text x="280" y="569" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">scenario_table_off</text><text x="592" y="569" font-size="18" fill="#486078" font-weight="400" text-anchor="start">Запустить настоящий HA с</text><text x="592" y="594" font-size="18" fill="#486078" font-weight="400" text-anchor="start">учебными обработчиками и</text><text x="592" y="619" font-size="18" fill="#486078" font-weight="400" text-anchor="start">ожиданиями</text><text x="913" y="569" font-size="18" fill="#7052b5" font-weight="600" text-anchor="start">1 ожидаемый вызов;</text><text x="913" y="594" font-size="18" fill="#7052b5" font-weight="600" text-anchor="start">новый OFF, прежний</text><text x="913" y="619" font-size="18" fill="#7052b5" font-weight="600" text-anchor="start">остаётся ON</text><rect x="40" y="687" width="1120" height="137" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="687" width="207" height="137" rx="16" fill="#fcece5" stroke="none"/><text x="60" y="735" font-size="21" fill="#b54537" font-weight="700" text-anchor="start">Assist Scenario</text><text x="60" y="763" font-size="21" fill="#b54537" font-weight="700" text-anchor="start">Lab</text><text x="280" y="724" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">API завершён; нет</text><text x="280" y="749" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">наблюдения слышимого</text><text x="280" y="774" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">ответа</text><text x="592" y="724" font-size="18" fill="#486078" font-weight="400" text-anchor="start">Отдельно оценить команду,</text><text x="592" y="749" font-size="18" fill="#486078" font-weight="400" text-anchor="start">действие и слышимость</text><text x="913" y="724" font-size="18" fill="#b54537" font-weight="600" text-anchor="start">Недостаточно данных;</text><text x="913" y="749" font-size="18" fill="#b54537" font-weight="600" text-anchor="start">неполный пример даёт</text><text x="913" y="774" font-size="18" fill="#b54537" font-weight="600" text-anchor="start">код 3</text><text x="40" y="884" font-size="18" fill="#15283f" font-weight="600" text-anchor="start">Верная сумма, готовый план, успешный тест и слышимый ответ отвечают на разные вопросы.</text><text x="40" y="919" font-size="16" fill="#486078" font-weight="400" text-anchor="start">Источники и точные команды: process-and-results.ru.md.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 868" lang="uk" role="img" aria-labelledby="visual-uk-868-title visual-uk-868-desc">
<title id="visual-uk-868-title">Перенесення ролі: одна подія, два різні результати</title><desc id="visual-uk-868-desc">Попередній пристрій залишається ввімкненим. Одна подія вимикає замінник. Рівно один очікуваний виклик; вимикати попередній заборонено. Логічні етапи не вимірюють час.</desc><rect width="1200" height="868" fill="#f5f8fc"/><g font-family="Arial, DejaVu Sans, sans-serif"><rect x="0" y="0" width="1200" height="152" rx="0" fill="#15283f" stroke="none"/><rect x="40" y="30" width="6" height="92" rx="3" fill="#43d0bd" stroke="none"/><text x="62" y="49" font-size="15" fill="#91e4da" font-weight="650" text-anchor="start">HA HOMELAB / 04</text><text x="62" y="91" font-size="32" fill="white" font-weight="700" text-anchor="start">Перенесення ролі: одна подія, два різні результати</text><text x="62" y="125" font-size="17" fill="#d4e1ef" font-weight="400" text-anchor="start">Включений синтетичний сценарій · справжній рушій HA · виклики пристроїв у пам’яті</text><text x="340" y="207" font-size="15" fill="#486078" font-weight="700" text-anchor="middle">ПОЧАТОК</text><text x="700" y="207" font-size="15" fill="#486078" font-weight="700" text-anchor="middle">ПОДІЯ / ДІЯ</text><text x="1080" y="207" font-size="15" fill="#486078" font-weight="700" text-anchor="middle">КІНЕЦЬ</text><rect x="40" y="236" width="1120" height="147" rx="16" fill="white" stroke="#cbd8e5"/><path d="M316 282 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="288" font-size="17" fill="#486078" font-weight="400" text-anchor="start">ON</text><path d="M316 343 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="349" font-size="17" fill="#486078" font-weight="400" text-anchor="start">OFF</text><rect x="40" y="409" width="1120" height="147" rx="16" fill="white" stroke="#cbd8e5"/><path d="M316 455 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="461" font-size="17" fill="#486078" font-weight="400" text-anchor="start">ON</text><path d="M316 516 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="522" font-size="17" fill="#486078" font-weight="400" text-anchor="start">OFF</text><path d="M700 224 V583" fill="none" stroke="#486078" stroke-width="2" stroke-dasharray="5 6"/><text x="62" y="284" font-size="22" fill="#116f93" font-weight="700" text-anchor="start">Попереднє</text><text x="62" y="313" font-size="22" fill="#116f93" font-weight="700" text-anchor="start">обладнання</text><text x="62" y="347" font-size="17" fill="#486078" font-weight="400" text-anchor="start">Команду не надіслано</text><text x="62" y="457" font-size="22" fill="#7052b5" font-weight="700" text-anchor="start">Замінник ролі</text><text x="62" y="520" font-size="17" fill="#486078" font-weight="400" text-anchor="start">Один виклик turn_off</text><path d="M340 282 H1080" fill="none" stroke="#116f93" stroke-width="6"/><path d="M340 455 H700 V516 H1080" fill="none" stroke="#7052b5" stroke-width="6"/><circle cx="340" cy="282" r="8" fill="#116f93"/><circle cx="1080" cy="282" r="8" fill="#116f93"/><circle cx="340" cy="455" r="8" fill="#7052b5"/><circle cx="1080" cy="516" r="8" fill="#7052b5"/><text x="600" y="612" font-size="19" fill="#15283f" font-weight="600" text-anchor="middle">Логічна послідовність (не виміряна вісь часу)</text><rect x="40" y="647" width="548" height="110" rx="16" fill="#eee8fa" stroke="none"/><text x="60" y="679" font-size="14" fill="#7052b5" font-weight="700" text-anchor="start">ОЧІКУВАНИЙ ВИКЛИК</text><text x="60" y="711" font-size="19" fill="#7052b5" font-weight="600" text-anchor="start">switch.turn_off → switch.scenario_table</text><text x="60" y="739" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">Кінцевий стан: вимкнено</text><rect x="612" y="647" width="548" height="110" rx="16" fill="#e2f3fb" stroke="none"/><text x="632" y="679" font-size="14" fill="#116f93" font-weight="700" text-anchor="start">ЗАБОРОНЕНИЙ ВИКЛИК</text><text x="632" y="711" font-size="19" fill="#116f93" font-weight="600" text-anchor="start">turn_off → switch.scenario_retired_plug</text><text x="632" y="739" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">Кінцевий стан: увімкнено</text><text x="40" y="802" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">Приклад задає 40 ms до події й 100 ms для усталення; це не виміряна затримка.</text><text x="40" y="838" font-size="16" fill="#486078" font-weight="400" text-anchor="start">Джерело: role-transfer.scenario.json · діаграма не перевіряє фізичне реле чи живлення.</text></g></svg>

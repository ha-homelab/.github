<title id="visual-tr-888-title">Kaydedilmiş Linux test sonuçları</title><desc id="visual-tr-888-desc">Geçen testler: Entity Migrations 36 ve bir atlama; Meter Contracts 75; Scenario Tests 54, yedi gerçek HA testi dahil; Assist Scenario Lab 24. Sayılar kalite sıralaması değildir.</desc><rect width="1200" height="888" fill="#f5f8fc"/><g font-family="Arial, DejaVu Sans, sans-serif"><rect x="0" y="0" width="1200" height="152" rx="0" fill="#15283f" stroke="none"/><rect x="40" y="30" width="6" height="92" rx="3" fill="#43d0bd" stroke="none"/><text x="62" y="49" font-size="15" fill="#91e4da" font-weight="650" text-anchor="start">HA HOMELAB / 03</text><text x="62" y="91" font-size="32" fill="white" font-weight="700" text-anchor="start">Kaydedilmiş Linux test sonuçları</text><text x="62" y="125" font-size="17" fill="#d4e1ef" font-weight="400" text-anchor="start">2026-10-16 UTC kanıt görüntüsü · test sayıları, cihaz performansı değil</text><path d="M338.0 220 V612" fill="none" stroke="#cbd8e5" stroke-width="2"/><text x="338.0" y="644" font-size="16" fill="#486078" font-weight="400" text-anchor="middle">0</text><path d="M512.0 220 V612" fill="none" stroke="#cbd8e5" stroke-width="2"/><text x="512.0" y="644" font-size="16" fill="#486078" font-weight="400" text-anchor="middle">20</text><path d="M686.0 220 V612" fill="none" stroke="#cbd8e5" stroke-width="2"/><text x="686.0" y="644" font-size="16" fill="#486078" font-weight="400" text-anchor="middle">40</text><path d="M860.0 220 V612" fill="none" stroke="#cbd8e5" stroke-width="2"/><text x="860.0" y="644" font-size="16" fill="#486078" font-weight="400" text-anchor="middle">60</text><path d="M1034.0 220 V612" fill="none" stroke="#cbd8e5" stroke-width="2"/><text x="1034.0" y="644" font-size="16" fill="#486078" font-weight="400" text-anchor="middle">80</text><text x="40" y="271" font-size="23" fill="#116f93" font-weight="650" text-anchor="start">Entity Migrations</text><rect x="338" y="244" width="313.2" height="39" rx="5" fill="#116f93" stroke="none"/><text x="665.2" y="271" font-size="18" fill="#116f93" font-weight="700" text-anchor="start">36 geçti</text><rect x="781.7" y="249" width="22" height="28" rx="3" fill="white" stroke="#116f93"/><text x="815.7" y="271" font-size="17" fill="#486078" font-weight="400" text-anchor="start">1 atlandı*</text><text x="40" y="368" font-size="23" fill="#087967" font-weight="650" text-anchor="start">Meter Contracts</text><rect x="338" y="341" width="652.5" height="39" rx="5" fill="#087967" stroke="none"/><text x="1004.5" y="368" font-size="18" fill="#087967" font-weight="700" text-anchor="start">75 geçti</text><text x="40" y="465" font-size="23" fill="#7052b5" font-weight="650" text-anchor="start">Scenario Tests</text><rect x="338" y="438" width="469.79999999999995" height="39" rx="5" fill="#7052b5" stroke="none"/><text x="821.8" y="465" font-size="18" fill="#7052b5" font-weight="700" text-anchor="start">54 geçti</text><text x="350" y="504" font-size="17" fill="#486078" font-weight="400" text-anchor="start">Gerçek Home Assistant motoruyla 7 test içerir</text><text x="40" y="562" font-size="23" fill="#b54537" font-weight="650" text-anchor="start">Assist Scenario Lab</text><rect x="338" y="535" width="208.79999999999998" height="39" rx="5" fill="#b54537" stroke="none"/><text x="560.8" y="562" font-size="18" fill="#b54537" font-weight="700" text-anchor="start">24 geçti</text><text x="686" y="680" font-size="18" fill="#15283f" font-weight="600" text-anchor="middle">Geçen test durumları (sayı)</text><rect x="40" y="714" width="1120" height="105" rx="16" fill="#e6edf5" stroke="none"/><text x="62" y="748" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">* Büyük/küçük harf duyarsız dosya sistemi testi Linux’ta atlandı; macOS’ta denendi.</text><text x="62" y="779" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">Test takımlarının kapsamları farklıdır. Çubuk uzunluğu kalite veya güvenlik sıralaması değildir.</text><text x="40" y="857" font-size="16" fill="#486078" font-weight="400" text-anchor="start">Kaynak: validation-evidence.json → dört bağlantılı GitHub Actions çalıştırması. Canlı sorgulama yok.</text></g></svg>

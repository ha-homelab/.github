<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 868" lang="it" role="img" aria-labelledby="visual-it-868-title visual-it-868-desc">
<title id="visual-it-868-title">Trasferimento di ruolo: un evento, due esiti distinti</title><desc id="visual-it-868-desc">Il vecchio dispositivo resta acceso. Un evento spegne il sostituto. Una sola chiamata attesa; vietata la chiamata di spegnimento del vecchio dispositivo. Le fasi logiche non misurano tempo trascorso.</desc><rect width="1200" height="868" fill="#f5f8fc"/><g font-family="Arial, DejaVu Sans, sans-serif"><rect x="0" y="0" width="1200" height="152" rx="0" fill="#15283f" stroke="none"/><rect x="40" y="30" width="6" height="92" rx="3" fill="#43d0bd" stroke="none"/><text x="62" y="49" font-size="15" fill="#91e4da" font-weight="650" text-anchor="start">HA HOMELAB / 04</text><text x="62" y="91" font-size="32" fill="white" font-weight="700" text-anchor="start">Trasferimento di ruolo: un evento, due esiti distinti</text><text x="62" y="125" font-size="17" fill="#d4e1ef" font-weight="400" text-anchor="start">Scenario sintetico incluso · vero motore HA · callback dei dispositivi in memoria</text><text x="340" y="207" font-size="15" fill="#486078" font-weight="700" text-anchor="middle">INIZIALE</text><text x="700" y="207" font-size="15" fill="#486078" font-weight="700" text-anchor="middle">EVENTO / AZIONE</text><text x="1080" y="207" font-size="15" fill="#486078" font-weight="700" text-anchor="middle">FINALE</text><rect x="40" y="236" width="1120" height="147" rx="16" fill="white" stroke="#cbd8e5"/><path d="M316 282 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="288" font-size="17" fill="#486078" font-weight="400" text-anchor="start">ON</text><path d="M316 343 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="349" font-size="17" fill="#486078" font-weight="400" text-anchor="start">OFF</text><rect x="40" y="409" width="1120" height="147" rx="16" fill="white" stroke="#cbd8e5"/><path d="M316 455 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="461" font-size="17" fill="#486078" font-weight="400" text-anchor="start">ON</text><path d="M316 516 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="522" font-size="17" fill="#486078" font-weight="400" text-anchor="start">OFF</text><path d="M700 224 V583" fill="none" stroke="#486078" stroke-width="2" stroke-dasharray="5 6"/><text x="62" y="284" font-size="22" fill="#116f93" font-weight="700" text-anchor="start">Hardware</text><text x="62" y="313" font-size="22" fill="#116f93" font-weight="700" text-anchor="start">precedente</text><text x="62" y="347" font-size="17" fill="#486078" font-weight="400" text-anchor="start">Nessun comando inviato</text><text x="62" y="457" font-size="22" fill="#7052b5" font-weight="700" text-anchor="start">Ruolo sostitutivo</text><text x="62" y="520" font-size="17" fill="#486078" font-weight="400" text-anchor="start">Una chiamata turn_off</text><path d="M340 282 H1080" fill="none" stroke="#116f93" stroke-width="6"/><path d="M340 455 H700 V516 H1080" fill="none" stroke="#7052b5" stroke-width="6"/><circle cx="340" cy="282" r="8" fill="#116f93"/><circle cx="1080" cy="282" r="8" fill="#116f93"/><circle cx="340" cy="455" r="8" fill="#7052b5"/><circle cx="1080" cy="516" r="8" fill="#7052b5"/><text x="600" y="612" font-size="19" fill="#15283f" font-weight="600" text-anchor="middle">Sequenza logica (non un asse temporale misurato)</text><rect x="40" y="647" width="548" height="110" rx="16" fill="#eee8fa" stroke="none"/><text x="60" y="679" font-size="14" fill="#7052b5" font-weight="700" text-anchor="start">CHIAMATA ATTESA</text><text x="60" y="711" font-size="19" fill="#7052b5" font-weight="600" text-anchor="start">switch.turn_off → switch.scenario_table</text><text x="60" y="739" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">Stato finale: spento</text><rect x="612" y="647" width="548" height="110" rx="16" fill="#e2f3fb" stroke="none"/><text x="632" y="679" font-size="14" fill="#116f93" font-weight="700" text-anchor="start">CHIAMATA VIETATA</text><text x="632" y="711" font-size="19" fill="#116f93" font-weight="600" text-anchor="start">turn_off → switch.scenario_retired_plug</text><text x="632" y="739" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">Stato finale: acceso</text><text x="40" y="802" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">Il fixture richiede 40 ms prima dell’evento e 100 ms di assestamento; non sono latenze misurate.</text><text x="40" y="838" font-size="16" fill="#486078" font-weight="400" text-anchor="start">Fonte: role-transfer.scenario.json · questo grafico non testa relè fisici o alimentazione.</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 949" lang="bn" role="img" aria-labelledby="visual-bn-949-title visual-bn-949-desc">
<title id="visual-bn-949-title">ইনপুট, পরীক্ষা ও ফল</title><desc id="visual-bn-949-desc">ইনপুট, পরীক্ষা ও আউটপুটের সচিত্র সারাংশ। কৃত্রিম হিসাব: 700 W + 0.02 kW + 0 W = 720 W। কাঁচা রিপোর্টের ছবি নয়।</desc><rect width="1200" height="949" fill="#f5f8fc"/><g font-family="Arial, DejaVu Sans, sans-serif"><rect x="0" y="0" width="1200" height="152" rx="0" fill="#15283f" stroke="none"/><rect x="40" y="30" width="6" height="92" rx="3" fill="#43d0bd" stroke="none"/><text x="62" y="49" font-size="15" fill="#91e4da" font-weight="650" text-anchor="start">HA HOMELAB / 02</text><text x="62" y="91" font-size="32" fill="white" font-weight="700" text-anchor="start">ইনপুট, পরীক্ষা ও ফল</text><text x="62" y="125" font-size="17" fill="#d4e1ef" font-weight="400" text-anchor="start">সঙ্গে থাকা কৃত্রিম উদাহরণের সচিত্র সারাংশ</text><text x="62" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">সরঞ্জাম</text><text x="280" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">ইনপুট</text><text x="592" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">পরীক্ষা / প্রক্রিয়া</text><text x="913" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">ফল</text><rect x="40" y="222" width="1120" height="137" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="222" width="207" height="137" rx="16" fill="#e2f3fb" stroke="none"/><text x="60" y="270" font-size="21" fill="#116f93" font-weight="700" text-anchor="start">Entity</text><text x="60" y="298" font-size="21" fill="#116f93" font-weight="700" text-anchor="start">Migrations</text><text x="280" y="259" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">light.table → switch.table</text><text x="592" y="259" font-size="18" fill="#486078" font-weight="400" text-anchor="start">ভূমিকা নীতি, সক্ষমতা ও সমর্থিত</text><text x="592" y="284" font-size="18" fill="#486078" font-weight="400" text-anchor="start">রেফারেন্স যাচাই</text><text x="913" y="259" font-size="18" fill="#116f93" font-weight="600" text-anchor="start">পর্যালোচনার পরিকল্পনা;</text><text x="913" y="284" font-size="18" fill="#116f93" font-weight="600" text-anchor="start">বিরোধে প্রস্তুত নয়</text><rect x="40" y="377" width="1120" height="137" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="377" width="207" height="137" rx="16" fill="#e0f4ec" stroke="none"/><text x="60" y="425" font-size="21" fill="#087967" font-weight="700" text-anchor="start">Meter Contracts</text><text x="280" y="414" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">700 W + 0.02 kW + 0 W</text><text x="592" y="414" font-size="18" fill="#486078" font-weight="400" text-anchor="start">একক স্বাভাবিক করে সতেজতা ও পৃথক</text><text x="592" y="439" font-size="18" fill="#486078" font-weight="400" text-anchor="start">উৎস যাচাই</text><text x="913" y="414" font-size="18" fill="#087967" font-weight="600" text-anchor="start">মোট 720 W; যৌথ ও</text><text x="913" y="439" font-size="18" fill="#087967" font-weight="600" text-anchor="start">পুনরাবৃত্ত উৎস দেখুন</text><rect x="40" y="532" width="1120" height="137" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="532" width="207" height="137" rx="16" fill="#eee8fa" stroke="none"/><text x="60" y="580" font-size="21" fill="#7052b5" font-weight="700" text-anchor="start">Scenario Tests</text><text x="280" y="569" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">scenario_table_off</text><text x="592" y="569" font-size="18" fill="#486078" font-weight="400" text-anchor="start">কৃত্রিম কলব্যাক ও নির্ভুল যাচাই</text><text x="592" y="594" font-size="18" fill="#486078" font-weight="400" text-anchor="start">দিয়ে প্রকৃত HA চালান</text><text x="913" y="569" font-size="18" fill="#7052b5" font-weight="600" text-anchor="start">প্রত্যাশিত কল 1টি; নতুন</text><text x="913" y="594" font-size="18" fill="#7052b5" font-weight="600" text-anchor="start">OFF, পুরোনো প্লাগ ON</text><rect x="40" y="687" width="1120" height=
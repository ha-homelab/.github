<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 949" lang="ko" role="img" aria-labelledby="visual-ko-949-title visual-ko-949-desc">
<title id="visual-ko-949-title">입력, 검사, 결과</title><desc id="visual-ko-949-desc">입력·검사·출력을 그림으로 요약합니다. 합성 계산: 700 W + 0.02 kW + 0 W = 720 W. 원본 보고서 화면이 아닙니다.</desc><rect width="1200" height="949" fill="#f5f8fc"/><g font-family="Arial, DejaVu Sans, sans-serif"><rect x="0" y="0" width="1200" height="152" rx="0" fill="#15283f" stroke="none"/><rect x="40" y="30" width="6" height="92" rx="3" fill="#43d0bd" stroke="none"/><text x="62" y="49" font-size="15" fill="#91e4da" font-weight="650" text-anchor="start">HA HOMELAB / 02</text><text x="62" y="91" font-size="32" fill="white" font-weight="700" text-anchor="start">입력, 검사, 결과</text><text x="62" y="125" font-size="17" fill="#d4e1ef" font-weight="400" text-anchor="start">포함된 합성 예제의 그림 요약</text><text x="62" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">도구</text><text x="280" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">입력</text><text x="592" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">검사 / 처리</text><text x="913" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">결과</text><rect x="40" y="222" width="1120" height="137" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="222" width="207" height="137" rx="16" fill="#e2f3fb" stroke="none"/><text x="60" y="270" font-size="21" fill="#116f93" font-weight="700" text-anchor="start">Entity</text><text x="60" y="298" font-size="21" fill="#116f93" font-weight="700" text-anchor="start">Migrations</text><text x="280" y="259" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">light.table → switch.table</text><text x="592" y="259" font-size="18" fill="#486078" font-weight="400" text-anchor="start">역할 정책, 기능, 지원 참조</text><text x="592" y="284" font-size="18" fill="#486078" font-weight="400" text-anchor="start">검사</text><text x="913" y="259" font-size="18" fill="#116f93" font-weight="600" text-anchor="start">검토 가능한 계획. 충돌</text><text x="913" y="284" font-size="18" fill="#116f93" font-weight="600" text-anchor="start">시 준비 차단</text><rect x="40" y="377" width="1120" height="137" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="377" width="207" height="137" rx="16" fill="#e0f4ec" stroke="none"/><text x="60" y="425" font-size="21" fill="#087967" font-weight="700" text-anchor="start">Meter Contracts</text><text x="280" y="414" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">700 W + 0.02 kW + 0 W</text><text x="592" y="414" font-size="18" fill="#486078" font-weight="400" text-anchor="start">단위 정규화, 최신성 및 독립</text><text x="592" y="439" font-size="18" fill="#486078" font-weight="400" text-anchor="start">소스 검사</text><text x="913" y="414" font-size="18" fill="#087967" font-weight="600" text-anchor="start">총 720 W. 공유·중복</text><text x="913" y="439" font-size="18" fill="#087967" font-weight="600" text-anchor="start">소스 검토</text><rect x="40" y="532" width="1120" height="137" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="532" width="207" height="137" rx="16" fill="#eee8fa" stroke="none"/><text x="60" y="580" font-size="21" fill="#7052b5" font-weight="700" text-anchor="start">Scenario Tests</text><text x="280" y="569" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">scenario_table_off</text><text x="592" y="569" font-size="18" fill="#486078" font-weight="400" text-anchor="start">합성 콜백과 정확한 단언으로</text><text x="592" y="594" font-size="18" fill="#486078" font-weight="400" text-anchor="start">실제 HA 실행</text><text x="913" y="569" font-size="18" fill="#7052b5" font-weight="600" text-anchor="start">기대 호출 1회. 새</text><text x="913" y="594" font-size="18" fill="#7052b5" font-weight="600" text-anchor="start">기기는 OFF, 이전</text><text x="913" y="619" font-size="18" fill="#7052b5" font-weight="600" text-anchor="start">플러그는 ON</text><rect x="40" y="687" width="1120" height="137" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="687" width="207" height="137" rx="16" fill="#fcece5" stroke="none"/><text x="60" y="735" font-size="21" fill="#b54537" font-weight="700" text-anchor="start">Assist Scenario</text><text x="60" y="763" font-size="21" fill="#b54537" font-weight="700" text-anchor="start">Lab</text><text x="280" y="724" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">API 완료, 청각 관측 누락</text><text x="592" y="724" font-size="18" fill="#486078" font-weight="400" text-anchor="start">정확성, 동작, 청각성을 따로</text><text x="592" y="749" font-size="18" fill="#486078" font-weight="400" text-anchor="start">평가</text><text x="913" y="724" font-size="18" fill="#b54537" font-weight="600" text-anchor="start">근거 불완전. 포함된</text><text x="913" y="749" font-size="18" fill="#b54537" font-weight="600" text-anchor="start">예제 종료 코드 3</text><text x="40" y="884" font-size="18" fill="#15283f" font-weight="600" text-anchor="start">유효 합계, 준비된 계획, 통과 시나리오, 청각 근거는 서로 다른 질문에 답합니다.</text><text x="40" y="919" font-size="16" fill="#486078" font-weight="400" text-anchor="start">출처와 정확한 명령: process-and-results.ko.md.</text></g></svg>

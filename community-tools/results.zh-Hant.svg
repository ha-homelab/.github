<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 949" lang="zh-Hant" role="img" aria-labelledby="visual-zh-Hant-949-title visual-zh-Hant-949-desc">
<title id="visual-zh-Hant-949-title">輸入、檢查與結果</title><desc id="visual-zh-Hant-949-desc">輸入、檢查與輸出圖解。合成算例：700 W 加 0.02 kW 加 0 W 等於 720 W。並非原始報告截圖。</desc><rect width="1200" height="949" fill="#f5f8fc"/><g font-family="Arial, DejaVu Sans, sans-serif"><rect x="0" y="0" width="1200" height="152" rx="0" fill="#15283f" stroke="none"/><rect x="40" y="30" width="6" height="92" rx="3" fill="#43d0bd" stroke="none"/><text x="62" y="49" font-size="15" fill="#91e4da" font-weight="650" text-anchor="start">HA HOMELAB / 02</text><text x="62" y="91" font-size="32" fill="white" font-weight="700" text-anchor="start">輸入、檢查與結果</text><text x="62" y="125" font-size="17" fill="#d4e1ef" font-weight="400" text-anchor="start">隨附合成示例的結果圖解</text><text x="62" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">工具</text><text x="280" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">輸入</text><text x="592" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">檢查 / 處理</text><text x="913" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">結果</text><rect x="40" y="222" width="1120" height="137" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="222" width="207" height="137" rx="16" fill="#e2f3fb" stroke="none"/><text x="60" y="270" font-size="21" fill="#116f93" font-weight="700" text-anchor="start">Entity</text><text x="60" y="298" font-size="21" fill="#116f93" font-weight="700" text-anchor="start">Migrations</text><text x="280" y="259" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">light.table → switch.table</text><text x="592" y="259" font-size="18" fill="#486078" font-weight="400" text-anchor="start">檢查角色策略、能力與受支援</text><text x="592" y="284" font-size="18" fill="#486078" font-weight="400" text-anchor="start">的引用</text><text x="913" y="259" font-size="18" fill="#116f93" font-weight="600" text-anchor="start">可審查計畫；存在衝突則</text><text x="913" y="284" font-size="18" fill="#116f93" font-weight="600" text-anchor="start">未就緒</text><rect x="40" y="377" width="1120" height="137" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="377" width="207" height="137" rx="16" fill="#e0f4ec" stroke="none"/><text x="60" y="425" font-size="21" fill="#087967" font-weight="700" text-anchor="start">Meter Contracts</text><text x="280" y="414" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">700 W + 0.02 kW + 0 W</text><text x="592" y="414" font-size="18" fill="#486078" font-weight="400" text-anchor="start">統一單位；核實資料時效與來</text><text x="592" y="439" font-size="18" fill="#486078" font-weight="400" text-anchor="start">源獨立性</text><text x="913" y="414" font-size="18" fill="#087967" font-weight="600" text-anchor="start">總計 720</text><text x="913" y="439" font-size="18" fill="#087967" font-weight="600" text-anchor="start">W；審查共享與重複來源</text><rect x="40" y="532" width="1120" height="137" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="532" width="207" height="137" rx="16" fill="#eee8fa" stroke="none"/><text x="60" y="580" font-size="21" fill="#7052b5" font-weight="700" text-anchor="start">Scenario Tests</text><text x="280" y="569" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">scenario_table_off</text><text x="592" y="569" font-size="18" fill="#486078" font-weight="400" text-anchor="start">使用合成回呼與精確斷言執行</text><text x="592" y="594" font-size="18" fill="#486078" font-weight="400" text-anchor="start">真實 HA</text><text x="913" y="569" font-size="18" fill="#7052b5" font-weight="600" text-anchor="start">1 次預期呼叫；新設備</text><text x="913" y="594" font-size="18" fill="#7052b5" font-weight="600" text-anchor="start">OFF，舊插座保持 ON</text><rect x="40" y="687" width="1120" height="137" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="687" width="207" height="137" rx="16" fill="#fcece5" stroke="none"/><text x="60" y="735" font-size="21" fill="#b54537" font-weight="700" text-anchor="start">Assist Scenario</text><text x="60" y="763" font-size="21" fill="#b54537" font-weight="700" text-anchor="start">Lab</text><text x="280" y="724" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">API 已完成；缺少可聽觀測</text><text x="592" y="724" font-size="18" fill="#486078" font-weight="400" text-anchor="start">分別評估正確性、動作與可聽</text><text x="592" y="749" font-size="18" fill="#486078" font-weight="400" text-anchor="start">性</text><text x="913" y="724" font-size="18" fill="#b54537" font-weight="600" text-anchor="start">證據不完整；隨附示例結</text><text x="913" y="749" font-size="18" fill="#b54537" font-weight="600" text-anchor="start">束代碼為 3</text><text x="40" y="884" font-size="18" fill="#15283f" font-weight="600" text-anchor="start">有效總和、就緒計畫、通過的場景與可聽證據回答不同問題。</text><text x="40" y="919" font-size="16" fill="#486078" font-weight="400" text-anchor="start">來源與具體命令：process-and-results.zh-Hant.md。</text></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 868" lang="cs" role="img" aria-labelledby="visual-cs-868-title visual-cs-868-desc">
<title id="visual-cs-868-title">Přenos role: jedna událost, dva různé výsledky</title><desc id="visual-cs-868-desc">Původní zařízení zůstává zapnuté. Jedna událost vypne náhradu. Právě jedno očekávané volání; vypnutí původního zařízení zakázáno. Logické fáze neměří uplynulý čas.</desc><rect width="1200" height="868" fill="#f5f8fc"/><g font-family="Arial, DejaVu Sans, sans-serif"><rect x="0" y="0" width="1200" height="152" rx="0" fill="#15283f" stroke="none"/><rect x="40" y="30" width="6" height="92" rx="3" fill="#43d0bd" stroke="none"/><text x="62" y="49" font-size="15" fill="#91e4da" font-weight="650" text-anchor="start">HA HOMELAB / 04</text><text x="62" y="91" font-size="32" fill="white" font-weight="700" text-anchor="start">Přenos role: jedna událost, dva různé výsledky</text><text x="62" y="125" font-size="17" fill="#d4e1ef" font-weight="400" text-anchor="start">Přibalený syntetický scénář · skutečný engine HA · zpětná volání zařízení v paměti</text><text x="340" y="207" font-size="15" fill="#486078" font-weight="700" text-anchor="middle">POČÁTEK</text><text x="700" y="207" font-size="15" fill="#486078" font-weight="700" text-anchor="middle">UDÁLOST / AKCE</text><text x="1080" y="207" font-size="15" fill="#486078" font-weight="700" text-anchor="middle">KONEC</text><rect x="40" y="236" width="1120" height="147" rx="16" fill="white" stroke="#cbd8e5"/><path d="M316 282 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="288" font-size="17" fill="#486078" font-weight="400" text-anchor="start">ON</text><path d="M316 343 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="349" font-size="17" fill="#486078" font-weight="400" text-anchor="start">OFF</text><rect x="40" y="409" width="1120" height="147" rx="16" fill="white" stroke="#cbd8e5"/><path d="M316 455 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="461" font-size="17" fill="#486078" font-weight="400" text-anchor="start">ON</text><path d="M316 516 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="522" font-size="17" fill="#486078" font-weight="400" text-anchor="start">OFF</text><path d="M700 224 V583" fill="none" stroke="#486078" stroke-width="2" stroke-dasharray="5 6"/><text x="62" y="284" font-size="22" fill="#116f93" font-weight="700" text-anchor="start">Původní hardware</text><text x="62" y="347" font-size="17" fill="#486078" font-weight="400" text-anchor="start">Žádný odeslaný příkaz</text><text x="62" y="457" font-size="22" fill="#7052b5" font-weight="700" text-anchor="start">Náhrada role</text><text x="62" y="520" font-size="17" fill="#486078" font-weight="400" text-anchor="start">Jedno volání turn_off</text><path d="M340 282 H1080" fill="none" stroke="#116f93" stroke-width="6"/><path d="M340 455 H700 V516 H1080" fill="none" stroke="#7052b5" stroke-width="6"/><circle cx="340" cy="282" r="8" fill="#116f93"/><circle cx="1080" cy="282" r="8" fill="#116f93"/><circle cx="340" cy="455" r="8" fill="#7052b5"/><circle cx="1080" cy="516" r="8" fill="#7052b5"/><text x="600" y="612" font-size="19" fill="#15283f" font-weight="600" text-anchor="middle">Logická sekvence (ne měřená časová osa)</text><rect x="40" y="647" width="548" height="110" rx="16" fill="#eee8fa" stroke="none"/><text x="60" y="679" font-size="14" fill="#7052b5" font-weight="700" text-anchor="start">OČEKÁVANÉ VOLÁNÍ</text><text x="60" y="711" font-size="19" fill="#7052b5" font-weight="600" text-anchor="start">switch.turn_off → switch.scenario_table</text><text x="60" y="739" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">Konečný stav: vypnuto</text><rect x="612" y="647" width="548" height="110" rx="16" fill="#e2f3fb" stroke="none"/><text x="632" y="679" font-size="14" fill="#116f93" font-weight="700" text-anchor="start">ZAKÁZANÉ VOLÁNÍ</text><text x="632" y="711" font-size="19" fill="#116f93" font-weight="600" text-anchor="start">turn_off → switch.scenario_retired_plug</text><text x="632" y="739" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">Konečný stav: zapnuto</text><text x="40" y="802" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">Příklad žádá 40 ms před událostí a 100 ms na ustálení; nejde o měřenou latenci.</text><text x="40" y="838" font-size="16" fill="#486078" font-weight="400" text-anchor="start">Zdroj: role-transfer.scenario.json · graf netestuje fyzické relé ani napájení.</text></g></svg>

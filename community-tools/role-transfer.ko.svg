<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 868" lang="ko" role="img" aria-labelledby="visual-ko-868-title visual-ko-868-desc">
<title id="visual-ko-868-title">역할 이전: 한 이벤트, 두 결과</title><desc id="visual-ko-868-desc">이전 기기는 켜진 채 유지됩니다. 이벤트 하나가 교체 기기를 끕니다. 기대 호출은 정확히 하나이며 이전 기기 끄기는 금지됩니다. 논리적 단계이며 경과 시간 측정이 아닙니다.</desc><rect width="1200" height="868" fill="#f5f8fc"/><g font-family="Arial, DejaVu Sans, sans-serif"><rect x="0" y="0" width="1200" height="152" rx="0" fill="#15283f" stroke="none"/><rect x="40" y="30" width="6" height="92" rx="3" fill="#43d0bd" stroke="none"/><text x="62" y="49" font-size="15" fill="#91e4da" font-weight="650" text-anchor="start">HA HOMELAB / 04</text><text x="62" y="91" font-size="32" fill="white" font-weight="700" text-anchor="start">역할 이전: 한 이벤트, 두 결과</text><text x="62" y="125" font-size="17" fill="#d4e1ef" font-weight="400" text-anchor="start">포함된 합성 시나리오 · 실제 HA 엔진 · 메모리 내 기기 콜백</text><text x="340" y="207" font-size="15" fill="#486078" font-weight="700" text-anchor="middle">초기</text><text x="700" y="207" font-size="15" fill="#486078" font-weight="700" text-anchor="middle">이벤트 / 동작</text><text x="1080" y="207" font-size="15" fill="#486078" font-weight="700" text-anchor="middle">최종</text><rect x="40" y="236" width="1120" height="147" rx="16" fill="white" stroke="#cbd8e5"/><path d="M316 282 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="288" font-size="17" fill="#486078" font-weight="400" text-anchor="start">ON</text><path d="M316 343 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="349" font-size="17" fill="#486078" font-weight="400" text-anchor="start">OFF</text><rect x="40" y="409" width="1120" height="147" rx="16" fill="white" stroke="#cbd8e5"/><path d="M316 455 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="461" font-size="17" fill="#486078" font-weight="400" text-anchor="start">ON</text><path d="M316 516 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="522" font-size="17" fill="#486078" font-weight="400" text-anchor="start">OFF</text><path d="M700 224 V583" fill="none" stroke="#486078" stroke-width="2" stroke-dasharray="5 6"/><text x="62" y="284" font-size="22" fill="#116f93" font-weight="700" text-anchor="start">이전 하드웨어</text><text x="62" y="347" font-size="17" fill="#486078" font-weight="400" text-anchor="start">명령 없음</text><text x="62" y="457" font-size="22" fill="#7052b5" font-weight="700" text-anchor="start">교체 역할</text><text x="62" y="520" font-size="17" fill="#486078" font-weight="400" text-anchor="start">turn_off 한 번</text><path d="M340 282 H1080" fill="none" stroke="#116f93" stroke-width="6"/><path d="M340 455 H700 V516 H1080" fill="none" stroke="#7052b5" stroke-width="6"/><circle cx="340" cy="282" r="8" fill="#116f93"/><circle cx="1080" cy="282" r="8" fill="#116f93"/><circle cx="340" cy="455" r="8" fill="#7052b5"/><circle cx="1080" cy="516" r="8" fill="#7052b5"/><text x="600" y="612" font-size="19" fill="#15283f" font-weight="600" text-anchor="middle">논리적 순서(실측 시간 축 아님)</text><rect x="40" y="647" width="548" height="110" rx="16" fill="#eee8fa" stroke="none"/><text x="60" y="679" font-size="14" fill="#7052b5" font-weight="700" text-anchor="start">기대 호출</text><text x="60" y="711" font-size="19" fill="#7052b5" font-weight="600" text-anchor="start">switch.turn_off → switch.scenario_table</text><text x="60" y="739" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">최종 상태: off</text><rect x="612" y="647" width="548" height="110" rx="16" fill="#e2f3fb" stroke="none"/><text x="632" y="679" font-size="14" fill="#116f93" font-weight="700" text-anchor="start">금지 호출</text><text x="632" y="711" font-size="19" fill="#116f93" font-weight="600" text-anchor="start">turn_off → switch.scenario_retired_plug</text><text x="632" y="739" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">최종 상태: on</text><text x="40" y="802" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">테스트는 이벤트 전 40 ms, 안정화 100 ms를 요청합니다. 실측 지연이 아닙니다.</text><text x="40" y="838" font-size="16" fill="#486078" font-weight="400" text-anchor="start">출처: role-transfer.scenario.json. 이 그래프는 실제 릴레이나 전력 공급을 검사하지 않습니다.</text></g></svg>

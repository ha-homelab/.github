<title id="visual-es-868-title">Transferencia de rol: un evento, dos resultados</title><desc id="visual-es-868-desc">El dispositivo antiguo sigue encendido. Un evento apaga el sustituto. Se espera una única llamada y se prohíbe apagar el antiguo. Las etapas lógicas no miden tiempo transcurrido.</desc><rect width="1200" height="868" fill="#f5f8fc"/><g font-family="Arial, DejaVu Sans, sans-serif"><rect x="0" y="0" width="1200" height="152" rx="0" fill="#15283f" stroke="none"/><rect x="40" y="30" width="6" height="92" rx="3" fill="#43d0bd" stroke="none"/><text x="62" y="49" font-size="15" fill="#91e4da" font-weight="650" text-anchor="start">HA HOMELAB / 04</text><text x="62" y="91" font-size="32" fill="white" font-weight="700" text-anchor="start">Transferencia de rol: un evento, dos resultados</text><text x="62" y="125" font-size="17" fill="#d4e1ef" font-weight="400" text-anchor="start">Escenario sintético incluido · motor real de HA · callbacks en memoria</text><text x="340" y="207" font-size="15" fill="#486078" font-weight="700" text-anchor="middle">INICIAL</text><text x="700" y="207" font-size="15" fill="#486078" font-weight="700" text-anchor="middle">EVENTO / ACCIÓN</text><text x="1080" y="207" font-size="15" fill="#486078" font-weight="700" text-anchor="middle">FINAL</text><rect x="40" y="236" width="1120" height="147" rx="16" fill="white" stroke="#cbd8e5"/><path d="M316 282 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="288" font-size="17" fill="#486078" font-weight="400" text-anchor="start">ON</text><path d="M316 343 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="349" font-size="17" fill="#486078" font-weight="400" text-anchor="start">OFF</text><rect x="40" y="409" width="1120" height="147" rx="16" fill="white" stroke="#cbd8e5"/><path d="M316 455 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="461" font-size="17" fill="#486078" font-weight="400" text-anchor="start">ON</text><path d="M316 516 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="522" font-size="17" fill="#486078" font-weight="400" text-anchor="start">OFF</text><path d="M700 224 V583" fill="none" stroke="#486078" stroke-width="2" stroke-dasharray="5 6"/><text x="62" y="284" font-size="22" fill="#116f93" font-weight="700" text-anchor="start">Hardware</text><text x="62" y="313" font-size="22" fill="#116f93" font-weight="700" text-anchor="start">retirado</text><text x="62" y="347" font-size="17" fill="#486078" font-weight="400" text-anchor="start">Ningún comando enviado</text><text x="62" y="457" font-size="22" fill="#7052b5" font-weight="700" text-anchor="start">Rol sustituto</text><text x="62" y="520" font-size="17" fill="#486078" font-weight="400" text-anchor="start">Una llamada turn_off</text><path d="M340 282 H1080" fill="none" stroke="#116f93" stroke-width="6"/><path d="M340 455 H700 V516 H1080" fill="none" stroke="#7052b5" stroke-width="6"/><circle cx="340" cy="282" r="8" fill="#116f93"/><circle cx="1080" cy="282" r="8" fill="#116f93"/><circle cx="340" cy="455" r="8" fill="#7052b5"/><circle cx="1080" cy="516" r="8" fill="#7052b5"/><text x="600" y="612" font-size="19" fill="#15283f" font-weight="600" text-anchor="middle">Secuencia lógica (sin eje temporal medido)</text><rect x="40" y="647" width="548" height="110" rx="16" fill="#eee8fa" stroke="none"/><text x="60" y="679" font-size="14" fill="#7052b5" font-weight="700" text-anchor="start">LLAMADA PREVISTA</text><text x="60" y="711" font-size="19" fill="#7052b5" font-weight="600" text-anchor="start">switch.turn_off → switch.scenario_table</text><text x="60" y="739" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">Estado final: off</text><rect x="612" y="647" width="548" height="110" rx="16" fill="#e2f3fb" stroke="none"/><text x="632" y="679" font-size="14" fill="#116f93" font-weight="700" text-anchor="start">LLAMADA PROHIBIDA</text><text x="632" y="711" font-size="19" fill="#116f93" font-weight="600" text-anchor="start">turn_off → switch.scenario_retired_plug</text><text x="632" y="739" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">Estado final: on</text><text x="40" y="802" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">El caso pide 40 ms antes del evento y 100 ms de espera; no son latencias medidas.</text><text x="40" y="838" font-size="16" fill="#486078" font-weight="400" text-anchor="start">Fuente: role-transfer.scenario.json · el gráfico no prueba el relé físico ni la alimentación.</text></g></svg>

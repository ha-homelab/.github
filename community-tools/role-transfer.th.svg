<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 868" lang="th" role="img" aria-labelledby="visual-th-868-title visual-th-868-desc">
<title id="visual-th-868-title">ย้ายบทบาท: หนึ่งเหตุการณ์ สองผลลัพธ์</title><desc id="visual-th-868-desc">อุปกรณ์เดิมยังเปิด เหตุการณ์เดียวปิดตัวใหม่ คาดการเรียกหนึ่งครั้ง ห้ามปิดตัวเดิม ขั้นเชิงตรรกะไม่ใช่เวลาที่วัด</desc><rect width="1200" height="868" fill="#f5f8fc"/><g font-family="Arial, DejaVu Sans, sans-serif"><rect x="0" y="0" width="1200" height="152" rx="0" fill="#15283f" stroke="none"/><rect x="40" y="30" width="6" height="92" rx="3" fill="#43d0bd" stroke="none"/><text x="62" y="49" font-size="15" fill="#91e4da" font-weight="650" text-anchor="start">HA HOMELAB / 04</text><text x="62" y="91" font-size="32" fill="white" font-weight="700" text-anchor="start">ย้ายบทบาท: หนึ่งเหตุการณ์ สองผลลัพธ์</text><text x="62" y="125" font-size="17" fill="#d4e1ef" font-weight="400" text-anchor="start">สถานการณ์สังเคราะห์ที่ให้มา · เอนจิน HA จริง · คอลแบ็กในหน่วยความจำ</text><text x="340" y="207" font-size="15" fill="#486078" font-weight="700" text-anchor="middle">เริ่มต้น</text><text x="700" y="207" font-size="15" fill="#486078" font-weight="700" text-anchor="middle">เหตุการณ์ / การทำงาน</text><text x="1080" y="207" font-size="15" fill="#486078" font-weight="700" text-anchor="middle">สุดท้าย</text><rect x="40" y="236" width="1120" height="147" rx="16" fill="white" stroke="#cbd8e5"/><path d="M316 282 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="288" font-size="17" fill="#486078" font-weight="400" text-anchor="start">ON</text><path d="M316 343 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="349" font-size="17" fill="#486078" font-weight="400" text-anchor="start">OFF</text><rect x="40" y="409" width="1120" height="147" rx="16" fill="white" stroke="#cbd8e5"/><path d="M316 455 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="461" font-size="17" fill="#486078" font-weight="400" text-anchor="start">ON</text><path d="M316 516 H1115" fill="none" stroke="#cbd8e5" stroke-width="1"/><text x="274" y="522" font-size="17" fill="#486078" font-weight="400" text-anchor="start">OFF</text><path d="M700 224 V583" fill="none" stroke="#486078" stroke-width="2" stroke-dasharray="5 6"/><text x="62" y="284" font-size="22" fill="#116f93" font-weight="700" text-anchor="start">ฮาร์ดแวร์เดิม</text><text x="62" y="347" font-size="17" fill="#486078" font-weight="400" text-anchor="start">ไม่ส่งคำสั่ง</text><text x="62" y="457" font-size="22" fill="#7052b5" font-weight="700" text-anchor="start">บทบาทใหม่</text><text x="62" y="520" font-size="17" fill="#486078" font-weight="400" text-anchor="start">เรียก turn_off ครั้งเดียว</text><path d="M340 282 H1080" fill="none" stroke="#116f93" stroke-width="6"/><path d="M340 455 H700 V516 H1080" fill="none" stroke="#7052b5" stroke-width="6"/><circle cx="340" cy="282" r="8" fill="#116f93"/><circle cx="1080" cy="282" r="8" fill="#116f93"/><circle cx="340" cy="455" r="8" fill="#7052b5"/><circle cx="1080" cy="516" r="8" fill="#7052b5"/><text x="600" y="612" font-size="19" fill="#15283f" font-weight="600" text-anchor="middle">ลำดับเชิงตรรกะ (ไม่ใช่แกนเวลาที่วัด)</text><rect x="40" y="647" width="548" height="110" rx="16" fill="#eee8fa" stroke="none"/><text x="60" y="679" font-size="14" fill="#7052b5" font-weight="700" text-anchor="start">การเรียกที่คาด</text><text x="60" y="711" font-size="19" fill="#7052b5" font-weight="600" text-anchor="start">switch.turn_off → switch.scenario_table</text><text x="60" y="739" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">สถานะสุดท้าย: off</text><rect x="612" y="647" width="548" height="110" rx="16" fill="#e2f3fb" stroke="none"/><text x="632" y="679" font-size="14" fill="#116f93" font-weight="700" text-anchor="start">การเรียกที่ห้าม</text><text x="632" y="711" font-size="19" fill="#116f93" font-weight="600" text-anchor="start">turn_off → switch.scenario_retired_plug</text><text x="632" y="739" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">สถานะสุดท้าย: on</text><text x="40" y="802" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">ข้อมูลทดสอบขอ 40 ms ก่อนเหตุการณ์และ 100 ms ให้คงที่ ไม่ใช่ความหน่วงที่วัด</text><text x="40" y="838" font-size="16" fill="#486078" font-weight="400" text-anchor="start">แหล่งข้อมูล: role-transfer.scenario.json ภาพนี้ไม่ได้ทดสอบรีเลย์หรือการจ่ายไฟจริง</text></g></svg>

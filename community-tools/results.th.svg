<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 949" lang="th" role="img" aria-labelledby="visual-th-949-title visual-th-949-desc">
<title id="visual-th-949-title">ข้อมูลเข้า การตรวจ และผลลัพธ์</title><desc id="visual-th-949-desc">ภาพสรุปข้อมูลเข้า การตรวจ และผลส่งออก การคำนวณสังเคราะห์: 700 W + 0.02 kW + 0 W = 720 W ไม่ใช่ภาพรายงานดิบ</desc><rect width="1200" height="949" fill="#f5f8fc"/><g font-family="Arial, DejaVu Sans, sans-serif"><rect x="0" y="0" width="1200" height="152" rx="0" fill="#15283f" stroke="none"/><rect x="40" y="30" width="6" height="92" rx="3" fill="#43d0bd" stroke="none"/><text x="62" y="49" font-size="15" fill="#91e4da" font-weight="650" text-anchor="start">HA HOMELAB / 02</text><text x="62" y="91" font-size="32" fill="white" font-weight="700" text-anchor="start">ข้อมูลเข้า การตรวจ และผลลัพธ์</text><text x="62" y="125" font-size="17" fill="#d4e1ef" font-weight="400" text-anchor="start">ภาพสรุปตัวอย่างสังเคราะห์ที่ให้มา</text><text x="62" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">เครื่องมือ</text><text x="280" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">ข้อมูลเข้า</text><text x="592" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">การตรวจ / กระบวนการ</text><text x="913" y="202" font-size="14" fill="#486078" font-weight="700" text-anchor="start">ผลลัพธ์</text><rect x="40" y="222" width="1120" height="137" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="222" width="207" height="137" rx="16" fill="#e2f3fb" stroke="none"/><text x="60" y="270" font-size="21" fill="#116f93" font-weight="700" text-anchor="start">Entity</text><text x="60" y="298" font-size="21" fill="#116f93" font-weight="700" text-anchor="start">Migrations</text><text x="280" y="259" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">light.table → switch.table</text><text x="592" y="259" font-size="18" fill="#486078" font-weight="400" text-anchor="start">ตรวจนโยบายบทบาท ความสามารถ</text><text x="592" y="284" font-size="18" fill="#486078" font-weight="400" text-anchor="start">และการอ้างอิงที่รองรับ</text><text x="913" y="259" font-size="18" fill="#116f93" font-weight="600" text-anchor="start">แผนตรวจทานได้</text><text x="913" y="284" font-size="18" fill="#116f93" font-weight="600" text-anchor="start">ข้อขัดแย้งบล็อกความพร้อม</text><rect x="40" y="377" width="1120" height="137" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="377" width="207" height="137" rx="16" fill="#e0f4ec" stroke="none"/><text x="60" y="425" font-size="21" fill="#087967" font-weight="700" text-anchor="start">Meter Contracts</text><text x="280" y="414" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">700 W + 0.02 kW + 0 W</text><text x="592" y="414" font-size="18" fill="#486078" font-weight="400" text-anchor="start">ปรับหน่วย</text><text x="592" y="439" font-size="18" fill="#486078" font-weight="400" text-anchor="start">ตรวจความสดและแหล่งแยกกัน</text><text x="913" y="414" font-size="18" fill="#087967" font-weight="600" text-anchor="start">รวม 720 W</text><text x="913" y="439" font-size="18" fill="#087967" font-weight="600" text-anchor="start">ตรวจแหล่งร่วมและแหล่งซ้ำ</text><rect x="40" y="532" width="1120" height="137" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="532" width="207" height="137" rx="16" fill="#eee8fa" stroke="none"/><text x="60" y="580" font-size="21" fill="#7052b5" font-weight="700" text-anchor="start">Scenario Tests</text><text x="280" y="569" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">scenario_table_off</text><text x="592" y="569" font-size="18" fill="#486078" font-weight="400" text-anchor="start">รัน HA จริง</text><text x="592" y="594" font-size="18" fill="#486078" font-weight="400" text-anchor="start">พร้อมคอลแบ็กสังเคราะห์</text><text x="592" y="619" font-size="18" fill="#486078" font-weight="400" text-anchor="start">และข้อยืนยันที่แน่นอน</text><text x="913" y="569" font-size="18" fill="#7052b5" font-weight="600" text-anchor="start">คาดเรียก 1 ครั้ง; ตัวใหม่</text><text x="913" y="594" font-size="18" fill="#7052b5" font-weight="600" text-anchor="start">OFF ปลั๊กเดิม ON</text><rect x="40" y="687" width="1120" height="137" rx="16" fill="white" stroke="#cbd8e5"/><rect x="40" y="687" width="207" height="137" rx="16" fill="#fcece5" stroke="none"/><text x="60" y="735" font-size="21" fill="#b54537" font-weight="700" text-anchor="start">Assist Scenario</text><text x="60" y="763" font-size="21" fill="#b54537" font-weight="700" text-anchor="start">Lab</text><text x="280" y="724" font-size="18" fill="#15283f" font-weight="400" text-anchor="start">API เสร็จ ขาดข้อสังเกตการได้ยิน</text><text x="592" y="724" font-size="18" fill="#486078" font-weight="400" text-anchor="start">ประเมินความถูกต้อง การทำงาน</text><text x="592" y="749" font-size="18" fill="#486078" font-weight="400" text-anchor="start">และการได้ยินแยกกัน</text><text x="913" y="724" font-size="18" fill="#b54537" font-weight="600" text-anchor="start">หลักฐานไม่ครบ</text><text x="913" y="749" font-size="18" fill="#b54537" font-weight="600" text-anchor="start">ตัวอย่างจบด้วยรหัส 3</text><text x="40" y="884" font-size="18" fill="#15283f" font-weight="600" text-anchor="start">ผลรวมถูก แผนพร้อม สถานการณ์ผ่าน และหลักฐานเสียง ตอบคนละคำถาม</text><text x="40" y="919" font-size="16" fill="#486078" font-weight="400" text-anchor="start">แหล่งข้อมูลและคำสั่ง: process-and-results.th.md</text></g></svg>
